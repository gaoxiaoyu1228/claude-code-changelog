 gateways with `admin:` set, kept for `admin.identity_retention_days`, which the cost report groups by", "中文内容": "添加了 Claude 应用程序网关上每个开发人员 IdP 组的每日记录，并设置了`admin:`，保留`admin.identity_retention_days`，成本报告按其分组"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_NESTED_SESSION_ID`: set it to `1` on a self-hosted runner to have `claude -p` run inside a session use that session's ID and transcript, as in earlier versions", "中文内容": "添加了`CLAUDE_CODE_DISABLE_NESTED_SESSION_ID`：在自托管运行器上将其设置为`1`，以使`claude -p`在会话内运行，使用该会话的 ID 和脚本，如早期版本中一样"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed project and local MCP servers disconnecting after the first turn in some Claude desktop sessions", "中文内容": "修复了项目和本地 MCP 服务器在某些 Claude 桌面会话第一次启动后断开连接的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed auto mode failing every turn when an LLM gateway set as the base URL answers 403 or 422 to its server-side safety check (a 403 with an apiKeyHelper is unchanged)", "中文内容": "修复了当 LLM 网关设置为基本 URL 对其服务器端安全检查应答 403 或 422 时，自动模式每次都会失败的问题（带有 apiKeyHelper 的 403 未更改）"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `claude auth status` exiting before a slow token refresh was saved, which could sign you out on the next run", "中文内容": "修复了`claude auth status`在保存缓慢令牌刷新之前退出的问题，这可能会导致您在下次运行时退出"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed a project's `effortLevel` setting being ignored by sessions that an app starts ahead of time and then opens in the project, such as new sessions in the desktop app's Code tab", "中文内容": "修复了应用程序提前启动然后在项目中打开的会话忽略项目的`effortLevel`设置，例如桌面应用程序的“代码”选项卡中的新会话"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `claude --from-pr` reporting \"No conversations found\" in projects with many sessions when the linked session was older than the first page", "中文内容": "修复了当链接会话早于第一页时，`claude --from-pr`在具有许多会话的项目中报告“未找到对话”的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed the second of two simultaneous permission prompts showing no file path or command on claude.ai and the mobile apps", "中文内容": "修复了 claude.ai 和移动应用程序上两个同时权限提示中的第二个不显示文件路径或命令的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Remote Control and SDK hosts offering \"don't ask again\" on a mod's tool calls", "中文内容": "修复了远程控制和 SDK 主机在 mod 工具调用中提供“不再询问”的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed session titles being lost in cloud and SDK sessions when a new message or Stop arrived while the title was generating", "中文内容": "修复了在生成标题时收到新消息或停止时会话标题在云和 SDK 会话中丢失的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed self-paced `/loop` wakeups sometimes not being scheduled when Claude left a field out of its request", "中文内容": "修复了当克劳德在其请求中留下一个字段时，有时不会安排自定进度的`/loop`唤醒"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed auto mode in cloud sessions stopping for approval when the Artifact tool uploaded, wrote to a database or saved a file through the outputs folder", "中文内容": "修复了当 Artifact 工具上传、写入数据库或通过输出文件夹保存文件时云会话中的自动模式停止等待批准的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed skills synced from claude.ai being lost or downloaded again every ten minutes when they can't be written to disk", "中文内容": "修复了从 claude.ai 同步的技能在无法写入磁盘时丢失或每十分钟重新下载一次的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `/schedule` leaving a cloud scheduled task's next run time and link out of its results after creating or updating it", "中文内容": "修复了`/schedule`在创建或更新后留下云计划任务的下一次运行时间并链接出其结果的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed screen readers speaking a running subagent's elapsed time and token count on every change in screen reader mode", "中文内容": "修复了屏幕阅读器在屏幕阅读器模式的每次更改时说出正在运行的子代理的运行时间和令牌计数的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed a region or network block (HTTP 403) being shown as a sign-in failure; the error now explains the block", "中文内容": "修复了显示为登录失败的区域或网络块（HTTP 403）；现在错误解释了该块"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Claude saying a working claude.ai connector needed authorization or had failed in cloud sessions when a synced plugin included the same server", "中文内容": "修复了 Claude 表示当同步插件包含同一服务器时工作的 claude.ai 连接器需要授权或在云会话中失败的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `claude -p` exiting 0 when a full disk or quota lost its transcript or ~/.claude.json writes; it now prints an error and, in text and json output, exits 1. Full NFS exports may be missed", "中文内容": "修复了当磁盘已满或配额丢失其记录或 ~/.claude.json 写入时`claude -p`退出 0 的问题；现在，它会打印一个错误，并在文本和 json 输出中退出 1。可能会错过完整的 NFS 导出"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed edits to settings files made in the first second or so after launch not taking effect until a settings file changed again", "中文内容": "修复了启动后第一秒左右对设置文件所做的编辑，直到设置文件再次更改后才会生效"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed old transcripts not being cleaned up on machines where some runs skip cleanup, such as runs using `--setting-sources`", "中文内容": "修复了在某些运行跳过清理的机器上未清理旧记录的问题，例如使用`--setting-sources`运行"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed deleted agent team inboxes being re-created by a teammate's late message", "中文内容": "修复了因队友迟到的消息而重新创建已删除的特工团队收件箱的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed a re-created agent teammate being removed from its team by an earlier shutdown approval", "中文内容": "修复了重新创建的特工队友因之前的关闭批准而被从其团队中删除的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed stored scheduled tasks being impossible to list or delete after scheduled tasks were turned off", "中文内容": "修复了关闭计划任务后无法列出或删除存储的计划任务的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Claude deleting your most recently updated `/team-onboarding` guide when asked to delete one without naming which", "中文内容": "修复了克劳德在被要求删除最近更新的`/team-onboarding`指南时删除它而不指明是哪个指南的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Claude saying a `/team-onboarding` guide was deleted when the server refused the delete", "中文内容": "修正了克劳德说当服务器拒绝删除时`/team-onboarding`指南被删除的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed the Claude apps gateway hiding Amazon Bedrock's \"Input is too long.\" error, which left sessions failing every turn with \"upstream rejected the request\" instead of compacting", "中文内容": "修复了克劳德应用程序网关隐藏 Amazon Bedrock 的“输入太长”的问题。错误，导致会话每次都失败，并显示“上游拒绝了请求”而不是压缩"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed self-hosted runner sessions losing recent turns or the whole conversation when restarted while a plan waited for approval", "中文内容": "修复了自托管跑步者会话在计划等待批准时重新启动时丢失最近回合或整个对话的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed \"Prompt is too long\" after automatic compaction in sessions whose very large CLAUDE.md changed since it was last sent", "中文内容": "修复了自上次发送以来非常大的 CLAUDE.md 已更改的会话中自动压缩后的“提示太长”"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed high memory use and slow startup in headless sessions with many plugins that register commands", "中文内容": "修复了使用许多注册命令的插件的无头会话中的高内存使用和缓慢启动问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed stdio MCP servers receiving an empty `AWS_BEARER_TOKEN_BEDROCK` when their env config sets it to empty; the variable is now unset, so the server can use the machine's own AWS credentials", "中文内容": "修复了 stdio MCP 服务器在环境配置将其设置为空时接收空的`AWS_BEARER_TOKEN_BEDROCK`；该变量现已取消设置，因此服务器可以使用计算机自己的 AWS 凭证"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed API requests failing with \"unable to get local issuer certificate\" behind some TLS-inspecting proxies after a root certificate renewal", "中文内容": "修复了根证书续订后，某些 TLS 检查代理后面的 API 请求因“无法获取本地颁发者证书”而失败的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed very long conversations losing their earlier summary when compaction had to shorten its own request", "中文内容": "修复了当压缩必须缩短其自己的请求时，很长的对话会丢失其先前的摘要"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed a PDF's own metadata being able to make Read and @-mentions under-count its pages", "中文内容": "修复了 PDF 自身的元数据能够使“阅读”和“@提及”低估其页面的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `DISABLE_PROMPT_CACHING_OPUS` and `DISABLE_PROMPT_CACHING_SONNET` having no effect on `[1m]`, other-region and undated spellings of the default model", "中文内容": "修复了`DISABLE_PROMPT_CACHING_OPUS`和`DISABLE_PROMPT_CACHING_SONNET`对`[1m]`、其他区域和默认模型的未注明日期的拼写没有影响的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `/artifacts` and the Artifact tool's shared list showing no shared artifacts when you have 200 or more of your own", "中文内容": "修复了`/artifacts`和 Artifact 工具的共享列表，当您拥有 200 个或更多自己的工件时，不会显示任何共享工件"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Claude treating partial Grep and Glob results as complete when a search hit its time limit", "中文内容": "修复了当搜索达到时间限制时 Claude 将部分 Grep 和 Glob 结果视为完整的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed OpenTelemetry exports to an `https://` endpoint through a proxy never being sent when they started while another export was still in progress", "中文内容": "修复了 OpenTelemetry 通过代理导出到`https://`端点时从未发送的问题，而另一个导出仍在进行中"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed a flood of connection attempts to a proxy that blocks (HTTP 403) OpenTelemetry exports to an `http://` endpoint", "中文内容": "修复了对代理的大量连接尝试，该代理阻止 (HTTP 403) OpenTelemetry 导出到`http://`端点"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed OpenTelemetry exports hanging indefinitely behind a proxy that never answers; they now time out after 10 seconds, or `OTEL_EXPORTER_OTLP_TIMEOUT` up to 30 seconds", "中文内容": "修复了 OpenTelemetry 导出无限期挂在永远不会应答的代理后面的问题；现在，它们会在 10 秒后超时，或`OTEL_EXPORTER_OTLP_TIMEOUT`最多 30 秒"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed resumed sessions telling Claude again about a file change it already knew about", "中文内容": "修复了恢复的会话再次告诉克劳德它已经知道的文件更改"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Claude sometimes not using a built-in tool in a resumed session after an earlier call failed because the tool was switched off", "中文内容": "修复了克劳德有时在先前的调用失败后在恢复的会话中不使用内置工具的问题，因为该工具已关闭"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `/remote-control` answering \"Unknown command\" instead of saying that Remote Control is turned off by the `disableRemoteControl` setting", "中文内容": "修复了`/remote-control`回答“未知命令”的问题，而不是说`disableRemoteControl`设置关闭了远程控制"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed agent team teammates in tmux or iTerm2 panes starting in auto mode when the lead session was in manual mode", "中文内容": "修复了当主导会话处于手动模式时，tmux 或 iTerm2 窗格中的代理团队队友以自动模式启动的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed a background session sometimes losing a just-made change of permission mode when it was upgraded or retired", "中文内容": "修复了后台会话在升级或停用时有时会丢失刚刚所做的权限模式更改"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed Ctrl+C stopping all running background agents when pressed to clear typed text at the prompt", "中文内容": "修复了按 Ctrl+C 在提示符下清除键入的文本时停止所有正在运行的后台代理的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed /feedback showing \"Enter to confirm\" while a report is being sent", "中文内容": "修复/反馈在发送报告时显示“输入确认”"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed child processes of a stopped shell command sometimes being sent SIGTERM twice, which could make some programs skip their cleanup", "中文内容": "修复了停止的 shell 命令的子进程有时会发送 SIGTERM 两次，这可能会使某些程序跳过其清理工作"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `claude -p` run inside a cloud or self-hosted runner session sharing that session's ID: it wrote into the session's transcript, and a restart could resume the wrong conversation", "中文内容": "修复了在云或自托管运行器会话中运行的`claude -p`共享该会话 ID 的问题：它写入了会话的记录，重新启动可能会恢复错误的对话"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Fixed `claude -p` run inside a cloud or self-hosted runner session generating a title of its own and sending it to that session", "中文内容": "修复了在云或自托管运行器会话中运行的`claude -p`生成自己的标题并将其发送到该会话的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved the error shown on Microsoft Foundry when Azure credentials can't be loaded: it now says to check or refresh them, and reports as `cloud_credential_error`", "中文内容": "改进了无法加载 Azure 凭据时 Microsoft Foundry 上显示的错误：现在显示要检查或刷新它们，并报告为`cloud_credential_error`"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved `/design-sync` to say up front when your design system has moved to Claude, and stop before building instead of failing at upload", "中文内容": "改进了`/design-sync`，当您的设计系统已转移到 Claude 时预先说明，并在构建之前停止，而不是上传失败"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved the startup error when a required Claude apps gateway can't be reached: it points to the network instead of a sign-in, and says when the gateway's TLS certificate can't be verified", "中文内容": "改进了无法访问所需的 Claude 应用网关时的启动错误：它指向网络而不是登录，并在无法验证网关的 TLS 证书时提示"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved the \"Resume this session with\" hint shown at exit to repeat the flags you launched with (for example `--chrome --debug`) ahead of `--resume`", "中文内容": "改进了退出时显示的“通过以下方式恢复此会话”提示，以重复在`--resume`之前启动的标志（例如`--chrome --debug`）"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved how self-hosted runners recover from server errors: after a 5xx other than 501 or 529, a runner's next poll now opens a new connection instead of reusing the one that failed", "中文内容": "改进了自托管运行程序从服务器错误中恢复的方式：在 501 或 529 之外的 5xx 之后，运行程序的下一次轮询现在会打开一个新连接，而不是重用失败的连接"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved how self-hosted runner sessions recover from server errors: after a 5xx other than 501 or 529, a session now opens new connections instead of reusing the one that failed", "中文内容": "改进了自托管运行器会话从服务器错误中恢复的方式：在 501 或 529 之外的 5xx 之后，会话现在会打开新连接，而不是重用失败的连接"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Improved how self-hosted runner sessions recover when connections stop answering: after a heartbeat gets no answer, a session now opens new connections instead of trying each idle one in turn", "中文内容": "改进了当连接停止应答时自托管运行器会话的恢复方式：在心跳没有得到应答后，会话现在会打开新连接，而不是依次尝试每个空闲连接"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Changed SendMessage so a message to a running background agent arrives earlier: its running command moves to the background, without being stopped", "中文内容": "更改了 SendMessage，以便发送给正在运行的后台代理的消息更早到达：其正在运行的命令移至后台，而不会停止"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Changed subagents and teammates on a different model from the main conversation to use that model's saved effort level or its default, instead of the session's effort level", "中文内容": "将主对话中不同模型上的子代理和队友更改为使用该模型的已保存工作量级别或其默认值，而不是会话的工作量级别"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Changed exit to skip the \"Background work is running\" prompt for plugin monitors", "中文内容": "更改退出以跳过插件监视器的“后台工作正在运行”提示"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Changed the built-in `plugin-authoring` skill to offer once, after a mod you built works, to help share the mod", "中文内容": "将内置的“插件创作”技能更改为在您构建的模组工作后提供一次，以帮助共享该模组"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "移除", "内容": "Removed the Read tool's \"file unchanged since your last Read\" stub: reading an unchanged file again returns its content", "中文内容": "删除了读取工具的“自上次读取以来未更改的文件”存根：再次读取未更改的文件将返回其内容"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Windows: Fixed every tool call being refused on some volumes where the native path lookup fails; the working-directory check now compares the folder's identity instead", "中文内容": "Windows：修复了在本机路径查找失败的某些卷上拒绝每个工具调用的问题；工作目录检查现在改为比较文件夹的标识"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Windows: Fixed the session scratchpad and other temporary paths growing with your project's path length in sessions not started by Claude Desktop, which made repositories cloned into them hit the 260-character path limit", "中文内容": "Windows：修复了会话暂存器和其他临时路径在不是由 Claude Desktop 启动的会话中随项目路径长度增长的问题，这使得克隆到其中的存储库达到 260 个字符的路径限制"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Gateway: Fixed the status line and `/usage` showing a developer's own spend limit as 100% used after their group's pooled budget ran out", "中文内容": "网关：修复了状态行和`/usage`，显示开发人员自己的支出限额在其团队的汇总预算用完后已使用 100%"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Self-hosted runner: Fixed Claude not seeing the interrupted tool call when a session moves to a new runner and the turn is older than `CLAUDE_CODE_RESUME_INTERRUPTED_TURN_MAX_AGE_MS`", "中文内容": "自托管跑步者：修复了当会话移动到新跑步者并且回合早于`CLAUDE_CODE_RESUME_INTERRUPTED_TURN_MAX_AGE_MS`时，克劳德看不到中断的工具调用的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "Self-hosted runner: Fixed an MCP server that was switched off coming back on after the session moved to a new machine, when the session service had refused to save the switch", "中文内容": "自托管运行器：修复了会话移动到新计算机后，会话服务拒绝保存切换时关闭的 MCP 服务器重新打开的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "Remote Control: Improved fork names when the app doesn't set one: a long name keeps its \"(fork)\" ending, and in sessions started with `claude remote-control` a fork of \"Name (fork)\" is \"Name (fork 2)\"", "中文内容": "远程控制：当应用程序未设置分叉名称时，改进了分叉名称：长名称保留其“（分叉）”结尾，并且在以“claude Remote-control”启动的会话中，“名称（分叉）”的分叉是“名称（分叉2）”"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed forked conversations dropping messages: only one of the tool calls Claude ran in parallel was kept, and the last messages a compaction kept were lost, which could leave Claude's answer without the question it answered", "中文内容": "[VSCode] 修复了分叉对话丢失消息的问题：仅保留 Claude 并行运行的工具调用之一，并且压缩保留的最后一条消息丢失，这可能导致 Claude 的答案没有回答问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed a message being lost when Claude did not finish starting in time: the extension now starts Claude once more before showing the error", "中文内容": "[VSCode] 修复了当 Claude 未及时完成启动时丢失的消息：扩展现在在显示错误之前再次启动 Claude"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed the sign-in screen opening when a request is blocked for its region or network", "中文内容": "[VSCode] 修复了当其区域或网络阻止请求时登录屏幕打开的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed the Account panel showing the plan name with a lower-cased second word", "中文内容": "[VSCode] 修复了帐户面板显示计划名称带有小写第二个单词的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed file links in a Claude tab opening on top of the chat instead of in another editor group", "中文内容": "[VSCode] 修复了在聊天顶部而不是在另一个编辑器组中打开的 Claude 选项卡中的文件链接"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed attachment chips, menus, banners and dialogs in the Claude panel staying small when `chat.fontSize` is raised", "中文内容": "[VSCode] 修复了当`chat.fontSize`升高时 Claude 面板中的附件芯片、菜单、横幅和对话框保持较小的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[VSCode] Fixed `ultrathink` not raising effort for its turn or showing its rainbow when telemetry is off", "中文内容": "[VSCode] 修复了`ultrathink`在遥测关闭时不会提高其转弯强度或显示彩虹的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "[Cloud sessions] Added a link card to cloud sessions, so you can open or decline a link an MCP server asks you to visit instead of the request going unseen", "中文内容": "[云会话] 为云会话添加了链接卡，以便您可以打开或拒绝 MCP 服务器要求您访问的链接，而不是让请求消失"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "[Cloud sessions] Changed the organization environment dialog in admin settings to the personal dialogs' short layout: each section opens from a row, and unsaved input asks before closing", "中文内容": "[云会话] 将管理设置中的组织环境对话框更改为个人对话框的简短布局：每个部分从一行打开，未保存的输入在关闭前询问"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[Cloud sessions] Fixed adding a network secret for a host that already has one silently replacing it; the Add secret form now refuses and points you to the existing secret", "中文内容": "[云会话]修复了为已经有一个默默替换它的主机添加网络秘密的问题；添加秘密表单现在会拒绝并提示您现有的秘密"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[Cloud sessions] Fixed new scheduled tasks ignoring your organization's default environment: the form now starts on the one an admin chose instead of the Anthropic-hosted default", "中文内容": "[云会话] 修复了忽略组织默认环境的新计划任务：表单现在从管理员选择的表单而不是 Anthropic 托管的默认环境开始"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "修复", "内容": "[Remote Control] Fixed the next message to an idle session going unanswered after you restart `claude remote-control`, when you sent it within a minute of your previous message", "中文内容": "[远程控制] 修复了当您在上一条消息后一分钟内发送一条消息时，重新启动“claude Remote-control”后空闲会话的下一条消息无人应答的问题"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "改进", "内容": "[Claude Tag] Changed newly pasted artifact links in Slack to show a simpler card with an Open button that opens the artifact in Claude, instead of Slack's side panel", "中文内容": "[Claude Tag] 更改了 Slack 中新粘贴的工件链接，以显示一个更简单的卡片，其中带有打开按钮，可在 Claude 中打开工件，而不是 Slack 的侧面板"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_ULTRATHINK`, which turns the `ultrathink` keyword off", "中文内容": "添加了`CLAUDE_CODE_DISABLE_ULTRATHINK`，可关闭`ultrathink`关键字"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "Added pooled group budgets to the Claude apps gateway: one monthly budget that a group's members share, on top of each member's own limit, set with `pooled_budget` on the spend limits admin API", "中文内容": "向 Claude 应用程序网关添加了汇总群组预算：群组成员共享的一份每月预算，除了每个成员自己的限额之外，还可以在支出限额管理 API 上使用`pooled_budget`进行设置"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "Added `CLAUDE_CODE_DISABLE_LOOPED_CROSS_CERT_DROP` to keep system cross-certificates that certify each other in a loop, for servers whose private CA needs one", "中文内容": "添加了`CLAUDE_CODE_DISABLE_LOOPED_CROSS_CERT_DROP`，以保持系统交叉证书在循环中相互验证，对于其私有 CA 需要一个的服务器"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "Added `CLAUDE_CODE_SUBAGENT_EFFORT` to set the effort level subagents run at when nothing else names one, instead of inheriting the session's", "中文内容": "添加了`CLAUDE_CODE_SUBAGENT_EFFORT`以设置子代理在没有其他名称时运行的工作量级别，而不是继承会话的"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "Added `managed.policy_mode: layered` to the Claude apps gateway: every policy that matches a developer applies, each merged over the ones listed below it, not only the first", "中文内容": "在 Claude 应用程序网关中添加了“托管.策略模式：分层”：应用与开发人员匹配的每个策略，每个策略都合并到下面列出的策略上，而不仅仅是第一个策略"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "Added `guardrail.input_tagging` on Claude apps gateway Bedrock upstreams, which wraps prompts in the input tags that an Amazon Bedrock guardrail's prompt attacks filter needs; `all_messages_and_system` also tags the system prompt", "中文内容": "在 Claude 应用程序网关 Bedrock 上游添加了`guardrail.input_tagging`，它将提示包装在 Amazon Bedrock 护栏提示攻击过滤器所需的输入标签中； `all_messages_and_system` 还标记系统提示符"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "移除", "内容": "Deprecated fast mode for Opus 4.8 as of October 30, 2026; it will be removed on November 30, 2026. After removal, fast mode requests on Opus 4.8 return an error and do not fall back to standard Opus 4.8. Migrate to Opus 5.5 to keep the speedup", "中文内容": "自 2026 年 10 月 30 日起，Opus 4.8 已弃用快速模式；将于 2026 年 11 月 30 日删除。删除后，Opus 4.8 上的快速模式请求会返回错误，并且不会回退到标准 Opus 4.8。迁移到 Opus 5.5 以保持加速"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed shell commands being left running on macOS and Linux when Claude Code exits by itself, for example when credentials are refused or a cloud session is archived", "中文内容": "修复了当 Claude Code 自行退出时（例如当凭据被拒绝或云会话被存档时）在 macOS 和 Linux 上继续运行的 shell 命令"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed bash aliases with line breaks in their value (except in Git Bash), and functions whose names start with a dash, being garbled or lost in the Bash tool's shell", "中文内容": "修复了值中带有换行符的 bash 别名（Git Bash 中除外）以及名称以破折号开头的函数，在 Bash 工具的 shell 中出现乱码或丢失"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed bash scripts started from the Bash tool stopping after their first command when `SHELLOPTS` is exported", "中文内容": "修复了导出`SHELLOPTS`时从 Bash 工具启动的 bash 脚本在第一个命令后停止的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed PowerShell hooks not blocking on exit code 2 when the command begins with a type cast, `param`, `using` or an attribute", "中文内容": "修复了当命令以类型转换、`param`、`using`或属性开头时，PowerShell 挂钩不会在退出代码 2 上阻塞的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed some network requests hanging when a compressed response was cut off or corrupted", "中文内容": "修复了压缩响应被切断或损坏时挂起的一些网络请求"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `sonnet`, `opus` and `haiku` on Vertex AI and Amazon Bedrock showing an error mid-session instead of switching to an older model when the newest is not yet available to the account or region", "中文内容": "修复了 Vertex AI 和 Amazon Bedrock 上的`sonnet`、`opus`和`haiku`在会话中显示错误的问题，而不是在帐户或区域尚无法使用最新模型时切换到旧模型"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the Claude apps gateway not checking every model a request names against `availableModels`, `deniedModels` and `models`; a request that names a blocked model now gets a 400 naming the field", "中文内容": "修复了克劳德应用程序网关未根据`availableModels`、`deniedModels`和`models`检查请求名称的每个模型；命名被阻止模型的请求现在会收到 400 命名字段"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `claude auth login` refusing to run where managed settings require a Claude apps gateway; in a terminal it now shows the gateway sign-in", "中文内容": "修复了`claude auth login`拒绝在托管设置需要 Claude 应用程序网关的情况下运行的问题；现在在终端中显示网关登录"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `--restricted` sessions uploading files from outside the working directories when a Read allow rule covered them", "中文内容": "修复了`--restricted`会话在读取允许规则覆盖文件时从工作目录外部上传文件的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed prompts containing invisible characters needing a second Enter to send; plain prompts now send cleaned on the first Enter, and commands still wait for review", "中文内容": "修复了包含不可见字符需要第二次 Enter 才能发送的提示；简单的提示现在在第一次输入时发送清理，并且命令仍然等待审核"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed sub-agents that inherited a parent sub-agent's model moving to the main model when a background job or message woke them", "中文内容": "修复了当后台作业或消息唤醒子代理时继承父子代理模型的子代理移动到主模型的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed a managed `autoMode.allow` list without `\"$defaults\"` getting the built-in exceptions back from a host app's `--settings`, a first rule added in `/permissions`, or `/auto-mode-setup`", "中文内容": "修复了托管`autoMode.allow`列表，没有“$defaults”从主机应用程序的`--settings`获取内置异常，在`/permissions`或`/auto-mode-setup`中添加了第一条规则"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed cloud sessions and cloud scheduled tasks not being marked as failed when auto mode stopped a turn because the server returned no safety verdict", "中文内容": "修复了当自动模式停止转动时云会话和云计划任务不会被标记为失败的问题，因为服务器没有返回安全判决"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `claude -p` text output sometimes not saying why auto mode stopped a turn when a background agent was still running", "中文内容": "修复了`claude -p`文本输出有时不会说明为什么自动模式在后台代理仍在运行时停止转弯的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_AUTO_MODE_SERVER=1` being ignored in sessions started by a host application (such as Claude Desktop) behind a proxy or LLM gateway with experimental betas turned off", "中文内容": "修复了`CLAUDE_CODE_AUTO_MODE_SERVER=1`在代理或 LLM 网关后面的主机应用程序（例如 Claude Desktop）启动的会话中被忽略的问题，并且关闭了实验测试版"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed plugin MCP `headersHelper` scripts receiving a corrupted `CLAUDE_PLUGIN_ROOT` and server URL when a credential-named environment variable was set to a switch value such as `1`", "中文内容": "修复了当以凭证命名的环境变量设置为开关值（例如`1`）时，插件 MCP`headersHelper`脚本接收损坏的`CLAUDE_PLUGIN_ROOT`和服务器 URL"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the SDK `register_repo_root` control request not loading the CLAUDE.md of a directory outside the working directory (with `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1`)", "中文内容": "修复了 SDK `register_repo_root` 控制请求未加载工作目录之外目录的 CLAUDE.md（使用 `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1`）"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the Artifact tool showing `?` for artifact database access rules at the `self` level, and not quoting those rules back when it refuses a republish that would drop them", "中文内容": "修复了 Artifact 工具在`self`级别显示工件数据库访问规则的`?`，并且在拒绝重新发布时不会引用这些规则，从而删除这些规则"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `/model <id>` not warning when the model isn't recognized by this version and auto-compact will assume a 200K context window", "中文内容": "修复了当此版本无法识别模型且自动压缩将假定 200K 上下文窗口时`/model <id>`不会发出警告的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the \"hold space to speak\" hint using up its three showings in one session, and showing an empty key when push-to-talk is unbound", "中文内容": "修复了“保持空间说话”提示在一次会话中用完其三个显示，并在取消绑定一键通时显示空键的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed Grep and Glob never returning when the search process is killed at the timeout but does not exit, seen on Windows", "中文内容": "修复了当搜索进程在超时时终止但不退出时 Grep 和 Glob 永远不会返回（在 Windows 上看到）"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed a rare case where resuming a conversation did not restore its plan, when `/clear` or `/resume` had been run while part of that conversation was still being saved", "中文内容": "修复了一种罕见的情况，即当`/clear`或`/resume`已运行而部分对话仍在保存时，恢复对话未恢复其计划"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed first-run setup dropping words from the security notes and the terminal-setup explanation in narrow terminals", "中文内容": "修复了首次运行设置会从安全说明和窄终端中的终端设置说明中删除单词的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the Enterprise survey card taking a typed 1 or 0 after a short pause; a typed answer now needs Enter", "中文内容": "修复了企业调查卡在短暂暂停后输入 1 或 0 的问题；输入的答案现在需要 Enter"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Self-hosted runner: Fixed a message sent while Claude was working being answered after a Stop, once the session's process had been replaced", "中文内容": "自托管运行器：修复了克劳德工作时发送的消息在会话进程被替换后在停止后得到答复的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Self-hosted runner: Fixed an MCP server's on/off switch sometimes being lost when a session moved to a new machine", "中文内容": "自托管运行器：修复了当会话移动到新计算机时 MCP 服务器的开关有时会丢失的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Windows: Fixed the Bash tool losing your aliases and functions in Git Bash when the rc file sets errexit and pipefail and only winpty aliases, or none, are defined", "中文内容": "Windows：修复了当 rc 文件设置 errexit 和 pipelinefail 并且仅定义 winpty 别名或没有定义时，Bash 工具会丢失 Git Bash 中的别名和函数"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved `/code-review` started from the Code tab in Claude Desktop or on the web: cloud and `claude remote-control` sessions now show the findings card, not a plain-text list", "中文内容": "改进的`/code-review`从 Claude 桌面或网络上的“代码”选项卡启动：云和“claude 远程控制”会话现在显示结果卡，而不是纯文本列表"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved `/diff` on large repositories: each refresh usually runs one fewer full-repository git command, and refreshes are spaced out when git is slow", "中文内容": "改进了大型存储库上的`/diff`：每次刷新通常会少运行一个完整存储库 git 命令，并且当 git 速度较慢时刷新会间隔开"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved the messages shown when `/ultrareview`, a cloud session or a cloud agent finds no GitHub remote: they now say to create a rep rrors", "中文内容": "[VSCode] 修复了在设置文件有错误时过早删除已保存的`/btw`附带问题历史记录的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[VSCode] Fixed a conversation coming back in Auto mode after a reload or restart when its plan was approved with \"Yes, and manually approve edits\"", "中文内容": "[VSCode] 修复了当计划通过“是，并手动批准编辑”获得批准时，重新加载或重新启动后对话会返回自动模式的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "[Cloud sessions] Added a form card to cloud sessions, so you can fill in or decline a form an MCP server asks for instead of the request being canceled without you seeing it", "中文内容": "[云会话] 向云会话添加了表单卡，因此您可以填写或拒绝 MCP 服务器要求的表单，而不是在您看不到请求的情况下取消请求"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "[Cloud sessions] Added a \"Catching up…\" line that shows while a cloud or Remote Control session you switch back to is still bringing its messages up to date", "中文内容": "[云会话] 添加了一条“正在跟进...”行，显示您切换回的云或远程控制会话仍在更新其消息"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "[Cloud sessions] Changed network secrets so Enterprise members can add and delete them on their own cloud environments, instead of only viewing them", "中文内容": "[云会话]更改了网络机密，以便企业成员可以在自己的云环境中添加和删除它们，而不仅仅是查看它们"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "[Cloud sessions] Improved the Changes pane for cloud sessions: the note about what the list leaves out is now a badge beside the branch name, not a row above the diff", "中文内容": "[云会话] 改进了云会话的“更改”窗格：有关列表遗漏内容的注释现在是分支名称旁边的徽章，而不是差异上方的行"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[Cloud sessions] Fixed file search in a cloud session's Files pane showing folders as ../.. paths after Claude changed directory; results now show their path from the project's root", "中文内容": "[云会话] 修复了克劳德更改目录后，云会话的“文件”窗格中的文件搜索将文件夹显示为 ../.. 路径；结果现在显示了从项目根开始的路径"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[Claude Tag] Fixed Claude refusing to edit or append to a canvas it made in a Slack channel, from that channel, once the canvas was also sh   ORDER.map(k=>[k,`var(--${{新增:'add',修复:'fix',改进:'imp',移除:'rm',其他:'oth'}[k]}-bg)`]).forEach(([k,c])=>{if(!r[k])return;const hh=r[k]/max*h;y0-=hh;s+=`<rect x="${x}" y="${y0}" width="${w}" height="${hh}" fill="${c}"><title>${r.k}\n${ORDER.map(q=>`${t.k[q]} ${r[q]}`).join(' · ')}\n${L==='zh'?'版本数':'Versions'} ${r.v.size}</title></rect>`});
  if(tot)ORDER.forEach(q=>P[q].push([x+w/2,top+h-r[q]/tot*h]));
  if(showV&&r.v.size)s+=`<text x="${x+w/2}" y="${Y(tot)-4}" text-anchor="middle" style="fill:var(--acc)">${r.v.size}</text>`;
  if(i%step===0)s+=`<text x="${x+w/2}" y="${H-bot+14}" text-anchor="middle">${r.k.slice(2)}</text>`});
 ORDER.filter(q=>!HID.has(q)).forEach(q=>s+=`<path d="${sm(P[q])}" fill="none" stroke="var(--card)" stroke-width="3.4" opacity=".9"/><path d="${sm(P[q])}" fill="none" stroke="${DK[q]}" stroke-width="1.4" stroke-dasharray="5 4"/>`);
 return `<svg width="${W}" height="${H}">${s}</svg>`}
function hmap(D,f,cs,ti){const zh=L==='zh',vals=D.map(f).filter(v=>v>0).sort((a,b)=>a-b),q=p=>vals[Math.floor((vals.length-1)*p)]||1,th=[q(.25),q(.5),q(.75)];
 const lv=n=>!n?0:n<=th[0]?1:n<=th[1]?2:n<=th[2]?3:4,c=13,g=3,off=new Date(D[0].k).getDay(),wd=zh?['','一','','三','','五','']:['','Mon','','Wed','','Fri',''];
 const cols=Math.ceil((D.length+off)/7);let s='',lastM='';
 wd.forEach((w,i)=>s+=`<text x="0" y="${20+i*(c+g)+10}">${w}</text>`);
 D.forEach((r,i)=>{const j=i+off,x=28+Math.floor(j/7)*(c+g),y=20+(j%7)*(c+g),n=f(r);
  const mo=r.k.slice(0,7);if(mo!==lastM&&+r.k.slice(8)<=7&&j%7===0){s+=`<text x="${x}" y="12">${zh?(+mo.slice(5))+'月':new Date(r.k).toLocaleString('en',{month:'short'})}</text>`;lastM=mo}
  s+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" rx="2" fill="${cs[lv(n)]}" data-k="${r.k}" style="cursor:${n?'pointer':'default'}"><title>${r.k}  ${ti} ${n}</title></rect>`});
 const rg=(x,y)=>x>=y?`${y}`:`${x}–${y}`,rng=[rg(1,th[0]),rg(th[0]+1,th[1]),rg(th[1]+1,th[2]),`>${th[2]}`];
 return `<h4 style="margin:12px 0 4px;font-size:14px">${ti}</h4><div class="lg">${cs.map((x,i)=>`<span><i style="background:${x};width:12px;height:12px"></i>${i?rng[i-1]:'0'}</span>`).join('')}</div><div class="sc heat"><svg width="${28+cols*(c+g)}" height="${20+7*(c+g)}">${s}</svg></div>`}
function heat(D){const zh=L==='zh',tot=r=>ORDER.reduce((a,q)=>a+r[q],0);
 return `<div class="ch"><h3>${zh?'功能更新量示意图':'Feature update map'}</h3><div class="note">${zh?'每格一天，每列一周；颜色越深当天条数越多（按全部有更新日子的四分位分 4 档）。点格子看当天内容':'One cell per day; darker = more entries (4 quartile levels). Click for details'}</div>`
 +hmap(D,tot,['var(--line)','var(--h1)','var(--h2)','var(--h3)','var(--h4)'],zh?'每日更新总量':'Daily total updates')
 +hmap(D,r=>r.新增,['var(--line)','var(--n1)','var(--n2)','var(--n3)','var(--n4)'],zh?'每日新增量':'Daily new features')+'</div>'}
function cum(D){const zh=L==='zh',H=260,top=20,bot=40,lft=40,rt=44,bw=3,W=lft+rt+D.length*bw,h=H-top-bot;
 const vs=new Set();let n=0;const pts=D.map(r=>{r.v.forEach(v=>vs.add(v));n+=r.新增;return{k:r.k,v:vs.size,n}});
 const mv=pts[pts.length-1].v,mn=pts[pts.length-1].n,Yv=v=>top+h-v/mv*h,Yn=v=>top+h-v/mn*h;let s='';
 for(let i=0;i<=4;i++){const yy=top+h-h*i/4;s+=`<line x1="${lft}" x2="${W-rt}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${lft-4}" y="${yy+3}" text-anchor="end" style="fill:var(--acc)">${Math.round(mv*i/4)}</text><text x="${W-rt+4}" y="${yy+3}" style="fill:var(--add-fg)">${Math.round(mn*i/4)}</text>`}
 pts.forEach((p,i)=>{if(p.k.slice(8)==='01')s+=`<text x="${lft+i*bw}" y="${H-bot+14}" text-anchor="middle">${p.k.slice(2,7)}</text>`});
 const line=(f,c)=>`<polyline points="${pts.map((p,i)=>`${lft+i*bw},${f(p)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>`;
 s+=line(p=>Yv(p.v),'var(--acc)')+line(p=>Yn(p.n),'var(--add-fg)');
 return `<div class="ch"><h3>${zh?'发布累计版本量和累计新增需求量':'Cumulative versions & new features'}</h3><div class="note">${zh?`截至 ${last}：累计 ${mv} 个版本、${mn} 项新增`:`As of ${last}: ${mv} versions, ${mn} new features`}</div><div class="lg"><span><i style="background:var(--acc)"></i>${zh?'累计版本数（左轴）':'Cumulative versions (left)'}</span><span><i style="background:var(--add-fg)"></i>${zh?'累计新增数（右轴）':'Cumulative new (right)'}</span></div><div class="sc"><svg width="${W}" height="${H}">${s}</svg></div></div>`}
function grow(D){const zh=L==='zh',H=260,top=20,bot=40,lft=44,rt=20,bw=3,W=lft+rt+D.length*bw,h=H-top-bot;
 let a=0,b=0;const pts=D.map(r=>({k:r.k,a:a+=r.新增,b:b+=r.改进})),la=pts[pts.length-1],mx=Math.max(la.a,la.b),Y=v=>top+h-v/mx*h;let s='';
 for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);s+=`<line x1="${lft}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${lft-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`}
 pts.forEach((p,i)=>{if(p.k.slice(8)==='01')s+=`<text x="${lft+i*bw}" y="${H-bot+14}" text-anchor="middle">${p.k.slice(2,7)}</text>`});
 const line=(f,c)=>`<polyline points="${pts.map((p,i)=>`${lft+i*bw},${Y(f(p))}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2"/>`;
 s+=line(p=>p.b,'var(--imp-fg)').replace('2.2','3.5')+line(p=>p.a,'var(--add-fg)');const ex=lft+(pts.length-1)*bw;s+=`<text x="${ex-4}" y="${Y(la.a)-6}" text-anchor="end" style="fill:var(--add-fg);font-size:12px">${zh?'新增':'New'} ${la.a}</text><text x="${ex-4}" y="${Y(la.b)+16}" text-anchor="end" style="fill:var(--imp-fg);font-size:12px">${zh?'改进':'Improved'} ${la.b}</text>`;
 return `<div class="ch"><h3>${zh?'功能增长曲线':'Feature growth curve'}</h3><div class="note">${zh?`新增 = 功能点增长（做得多宽）；改进 = 功能完善性增长（做得多深）。截至 ${last}：累计新增 ${la.a}、累计改进 ${la.b}`:`New = breadth, Improved = depth. As of ${last}: new ${la.a}, improved ${la.b}`}</div><div class="lg"><span><i style="background:var(--add-fg)"></i>${zh?'累计新增':'Cumulative new'}</span><span><i style="background:var(--imp-fg)"></i>${zh?'累计改进':'Cumulative improved'}</span></div><div class="sc"><svg width="${W}" height="${H}">${s}</svg></div></div>`}
function stats(){const t=T[L],zh=L==='zh',el=document.getElementById('vs');
 // 公开站首屏只有最近 7 个发布日，全部历史没到之前不画图（否则只有两三列，还会误导）
 if(!FULL){el.innerHTML=`<div class="ch"><div class="note">${FAIL?(zh?'全部历史没加载成功，请刷新页面重试':'Could not load full history, please refresh'):t.loading}</div></div>`;return}
 const D=agg(d=>key(d)),Wk=agg(d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return key(x)}),M=agg(d=>key(d).slice(0,7));
 const lg=`<div class="lg"><span class="t 新增">${t.k.新增}</span><span class="t 改进">${t.k.改进}</span><span class="t 修复">${t.k.修复}</span><span class="t 移除">${t.k.移除}</span><span class="t 其他">${t.k.其他}</span></div><div class="lg">${zh?'虚线 = 各类占当期总更新量的比例（右轴）：':'Dashed = share of each type (right axis): '}${ORDER.map(q=>`<span data-q="${q}" style="cursor:pointer;${HID.has(q)?'opacity:.35;text-decoration:line-through':''}"><i style="border-top:2px dashed ${({新增:'var(--add-fg)',修复:'var(--fix-fg)',改进:'var(--imp-fg)',移除:'var(--rm-fg)',其他:'var(--oth-fg)'})[q]};height:0;margin-bottom:3px"></i>${t.k[q]}%</span>`).join('')}</div>`;
 const card=(ti,note,rows,bw,v,legV)=>`<div class="ch"><h3>${ti}</h3><div class="note">${note}</div>${lg}${legV?`<div class="lg"><span style="color:var(--acc)">${zh?'柱顶橙色数字 = 版本数':'Orange number on top = versions'}</span></div>`:''}<div class="sc">${chart(rows,bw,v)}</div></div>`;
 const DD=R90?D.slice(-90):D,rb=`<button class="btn rb" style="margin-left:8px;height:26px;padding:0 10px;font-size:12px">${R90?(zh?'看全部':'Show all'):(zh?'只看近 90 天':'Last 90 days')}</button>`;
 el.innerHTML=heat(D)+card(zh?'每日更新量':'Daily updates',(zh?`${R90?'近 90 天':`全部 ${D.length} 天`}，鼠标悬停看明细；点虚线图例可隐藏/显示该线`:`${R90?'Last 90 days':`All ${D.length} days`}; hover for details; click dashed legend to toggle`)+rb,DD,R90?9:7,false,false)
  +card(zh?'每周更新量与版本数':'Weekly updates & versions',zh?'周一到周日为一周，横轴是周一日期':'Weeks start Monday',Wk,22,true,true)
  +card(zh?'每月更新量与版本数':'Monthly updates & versions','',M,48,true,true)+cum(D)+grow(D);
 el.querySelectorAll('.sc').forEach(x=>x.scrollLeft=x.scrollWidth);
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;HID.has(q)?HID.delete(q):HID.add(q);try{localStorage.setItem('hid',JSON.stringify([...HID]))}catch(e){}stats()});
 el.querySelector('.rb').onclick=()=>{R90=!R90;try{localStorage.setItem('r90',R90?'1':'0')}catch(e){}stats()};
 el.querySelectorAll('.heat rect').forEach(b=>{if(by[b.dataset.k])b.onclick=()=>{sel=b.dataset.k;y=+sel.slice(0,4);m=+sel.slice(5,7)-1;draw();show();view('m');window.scrollTo(0,0)}})}

// 搜索：输入 2 个字以上，在英文原文和中文里找
const QI=document.getElementById('q');
function search(){const v=QI.value.trim().toLowerCase(),sr=document.getElementById('sr'),zh=L==='zh';QI.placeholder=zh?'搜索更新内容…':'Search updates…';
 if(v.length<2){sr.innerHTML='';sr.style.display='none';view(V);return}
 ['vl','vm','vy','vs','vf','detail'].forEach(i=>document.getElementById(i).style.display='none');sr.style.display='';
 const hit=DATA.filter(x=>x.内容.toLowerCase().includes(v)||(x.中文内容||'').toLowerCase().includes(v)).sort((a,b)=>b.日期.localeCompare(a.日期)),sh=hit.slice(0,300);
 sr.innerHTML=`<div class="ch"><h3>${zh?`搜索「${esc(QI.value)}」：${hit.length} 条`:`"${esc(QI.value)}": ${hit.length} results`}${hit.length>300?(zh?'（只显示最近 300 条）':' (latest 300 shown)'):''}</h3><ul>${sh.map(x=>`<li><a href="#" data-k="${x.日期}" style="color:var(--acc);margin-right:6px">${x.日期||'?'} v${x.版本}</a><span class="t ${x.类型}">${T[L].k[x.类型]}</span>${esc(zh&&x.中文内容?x.中文内容:x.内容)}</li>`).join('')}</ul></div>`;
 sr.querySelectorAll('a[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();const k=a.dataset.k;if(!by[k])return;sel=k;y=+k.slice(0,4);m=+k.slice(5,7)-1;F=null;QI.value='';search();view('m');draw();show();document.getElementById('detail').scrollIntoView()})}
QI.oninput=search;
document.getElementById('p').innerHTML=icon('prev');document.getElementById('nx').innerHTML=icon('next');
const dlg=document.getElementById('dlg'),subb=document.getElementById('subb');subb.hidden=!SRC;subb.onclick=()=>{WH={s:'',v:'',busy:false};subD();dlg.showModal()};dlg.addEventListener('submit',e=>{if(e.target.matches('[data-whf]')){e.preventDefault();whAct('sub')}});dlg.onclick=e=>{if(e.target===dlg)return dlg.close();const m=e.target.closest('[data-cm]'),d=e.target.closest('[data-dl]'),i=e.target.closest('.inf');tipX(e.target);if(i){const t=i.closest('.so').querySelector('.tip');t.hidden=!t.hidden;i.setAttribute('aria-expanded',!t.hidden)}if(m){CM=m.dataset.cm;subD()}if(d)dlCard(d.dataset.dl);const w=e.target.closest('[data-wh]');if(w)whAct(w.dataset.wh)};
// ⓘ 提示卡：点外面关，Esc 先关提示卡再关弹窗
function tipX(el){let n=0;dlg.querySelectorAll('.tip:not([hidden])').forEach(t=>{const b=t.closest('.so').querySelector('.inf');if(el&&(t.contains(el)||b.contains(el)))return;t.hidden=true;b.setAttribute('aria-expanded',false);n++});return n}
dlg.addEventListener('cancel',e=>{if(tipX(null))e.preventDefault()});
draw();show();view(V);search();goHash();
// 公开站：后台加载全部历史（data/all.json，英文字段），换成页面用的中文字段后重画
if(SRC)fetch(SRC).then(r=>r.json()).then(j=>{const K={new:'新增',improved:'改进',fixed:'修复',removed:'移除',other:'其他'};
 PT=j.published||PT;DATA=j.entries.map(r=>({日期:r.date,版本:r.version,类型:K[r.type],内容:r.en,中文内容:r.zh}));index();FULL=true;draw();show();
 if(QI.value.trim().length>=2)search();else if(V!=='l')view(V);goHash()}).catch(()=>{document.getElementById('sub').textContent+=' ⚠';FAIL=true;if(V==='s')stats();if(V==='y')year()});
</script>
