 session is archived", "中文内容": "修复了当 Claude Code 自行退出时（例如当凭据被拒绝或云会话被存档时）在 macOS 和 Linux 上继续运行的 shell 命令"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed bash aliases with line breaks in their value (except in Git Bash), and functions whose names start with a dash, being garbled or lost in the Bash tool's shell", "中文内容": "修复了值中带有换行符的 bash 别名（Git Bash 中除外）以及名称以破折号开头的函数，在 Bash 工具的 shell 中出现乱码或丢失"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed bash scripts started from the Bash tool stopping after their first command when `SHELLOPTS` is exported", "中文内容": "修复了导出`SHELLOPTS`时从 Bash 工具启动的 bash 脚本在第一个命令后停止的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed PowerShell hooks not blocking on exit code 2 when the command begins with a type cast, `param`, `using` or an attribute", "中文内容": "修复了当命令以类型转换、`param`、`using`或属性开头时，PowerShell 挂钩不会在退出代码 2 上阻塞的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed some network requests hanging when a compressed response was cut off or corrupted", "中文内容": "修复了压缩响应被切断或损坏时挂起的一些网络请求"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `sonnet`, `opus` and `haiku` on Vertex AI and Amazon Bedrock showing an error mid-session instead of switching to an older model when the newest is not yet available to the account or region", "中文内容": "修复了 Vertex AI 和 Amazon Bedrock 上的`sonnet`、`opus`和`haiku`在会话中显示错误的问题，而不是在帐户或区域尚无法使用最新模型时切换到旧模型"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the Claude apps gateway not checking every model a request names against `availableModels`, `deniedModels` and `models`; a request that names a blocked model now gets a 400 naming the field", "中文内容": "修复了克劳德应用程序网关未根据`availableModels`、`deniedModels`和`models`检查请求名称的每个模型；命名被阻止模型的请求现在会收到 400 命名字段"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `claude auth login` refusing to run where managed settings require a Claude apps gateway; in a terminal it now shows the gateway sign-in", "中文内容": "修复了`claude auth login`拒绝在托管设置需要 Claude 应用程序网关的情况下运行的问题；现在在终端中显示网关登录"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `--restricted` sessions uploading files from outside the working directories when a Read allow rule covered them", "中文内容": "修复了`--restricted`会话在读取允许规则覆盖文件时从工作目录外部上传文件的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed prompts containing invisible characters needing a second Enter to send; plain prompts now send cleaned on the first Enter, and commands still wait for review", "中文内容": "修复了包含不可见字符需要第二次 Enter 才能发送的提示；简单的提示现在在第一次输入时发送清理，并且命令仍然等待审核"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed sub-agents that inherited a parent sub-agent's model moving to the main model when a background job or message woke them", "中文内容": "修复了当后台作业或消息唤醒子代理时继承父子代理模型的子代理移动到主模型的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed a managed `autoMode.allow` list without `\"$defaults\"` getting the built-in exceptions back from a host app's `--settings`, a first rule added in `/permissions`, or `/auto-mode-setup`", "中文内容": "修复了托管`autoMode.allow`列表，没有“$defaults”从主机应用程序的`--settings`获取内置异常，在`/permissions`或`/auto-mode-setup`中添加了第一条规则"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed cloud sessions and cloud scheduled tasks not being marked as failed when auto mode stopped a turn because the server returned no safety verdict", "中文内容": "修复了当自动模式停止转动时云会话和云计划任务不会被标记为失败的问题，因为服务器没有返回安全判决"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `claude -p` text output sometimes not saying why auto mode stopped a turn when a background agent was still running", "中文内容": "修复了`claude -p`文本输出有时不会说明为什么自动模式在后台代理仍在运行时停止转弯的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_AUTO_MODE_SERVER=1` being ignored in sessions started by a host application (such as Claude Desktop) behind a proxy or LLM gateway with experimental betas turned off", "中文内容": "修复了`CLAUDE_CODE_AUTO_MODE_SERVER=1`在代理或 LLM 网关后面的主机应用程序（例如 Claude Desktop）启动的会话中被忽略的问题，并且关闭了实验测试版"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed plugin MCP `headersHelper` scripts receiving a corrupted `CLAUDE_PLUGIN_ROOT` and server URL when a credential-named environment variable was set to a switch value such as `1`", "中文内容": "修复了当以凭证命名的环境变量设置为开关值（例如`1`）时，插件 MCP`headersHelper`脚本接收损坏的`CLAUDE_PLUGIN_ROOT`和服务器 URL"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the SDK `register_repo_root` control request not loading the CLAUDE.md of a directory outside the working directory (with `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1`)", "中文内容": "修复了 SDK `register_repo_root` 控制请求未加载工作目录之外目录的 CLAUDE.md（使用 `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1`）"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the Artifact tool showing `?` for artifact database access rules at the `self` level, and not quoting those rules back when it refuses a republish that would drop them", "中文内容": "修复了 Artifact 工具在`self`级别显示工件数据库访问规则的`?`，并且在拒绝重新发布时不会引用这些规则，从而删除这些规则"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed `/model <id>` not warning when the model isn't recognized by this version and auto-compact will assume a 200K context window", "中文内容": "修复了当此版本无法识别模型且自动压缩将假定 200K 上下文窗口时`/model <id>`不会发出警告的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the \"hold space to speak\" hint using up its three showings in one session, and showing an empty key when push-to-talk is unbound", "中文内容": "修复了“保持空间说话”提示在一次会话中用完其三个显示，并在取消绑定一键通时显示空键的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed Grep and Glob never returning when the search process is killed at the timeout but does not exit, seen on Windows", "中文内容": "修复了当搜索进程在超时时终止但不退出时 Grep 和 Glob 永远不会返回（在 Windows 上看到）"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed a rare case where resuming a conversation did not restore its plan, when `/clear` or `/resume` had been run while part of that conversation was still being saved", "中文内容": "修复了一种罕见的情况，即当`/clear`或`/resume`已运行而部分对话仍在保存时，恢复对话未恢复其计划"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed first-run setup dropping words from the security notes and the terminal-setup explanation in narrow terminals", "中文内容": "修复了首次运行设置会从安全说明和窄终端中的终端设置说明中删除单词的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Fixed the Enterprise survey card taking a typed 1 or 0 after a short pause; a typed answer now needs Enter", "中文内容": "修复了企业调查卡在短暂暂停后输入 1 或 0 的问题；输入的答案现在需要 Enter"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Self-hosted runner: Fixed a message sent while Claude was working being answered after a Stop, once the session's process had been replaced", "中文内容": "自托管运行器：修复了克劳德工作时发送的消息在会话进程被替换后在停止后得到答复的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Self-hosted runner: Fixed an MCP server's on/off switch sometimes being lost when a session moved to a new machine", "中文内容": "自托管运行器：修复了当会话移动到新计算机时 MCP 服务器的开关有时会丢失的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "Windows: Fixed the Bash tool losing your aliases and functions in Git Bash when the rc file sets errexit and pipefail and only winpty aliases, or none, are defined", "中文内容": "Windows：修复了当 rc 文件设置 errexit 和 pipelinefail 并且仅定义 winpty 别名或没有定义时，Bash 工具会丢失 Git Bash 中的别名和函数"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved `/code-review` started from the Code tab in Claude Desktop or on the web: cloud and `claude remote-control` sessions now show the findings card, not a plain-text list", "中文内容": "改进的`/code-review`从 Claude 桌面或网络上的“代码”选项卡启动：云和“claude 远程控制”会话现在显示结果卡，而不是纯文本列表"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved `/diff` on large repositories: each refresh usually runs one fewer full-repository git command, and refreshes are spaced out when git is slow", "中文内容": "改进了大型存储库上的`/diff`：每次刷新通常会少运行一个完整存储库 git 命令，并且当 git 速度较慢时刷新会间隔开"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved the messages shown when `/ultrareview`, a cloud session or a cloud agent finds no GitHub remote: they now say to create a repository at https://github.com/new, and `/ultrareview` no longer suggests a `gh` command that `gh` rejects", "中文内容": "改进了当`/ultrareview`、云会话或云代理找不到 GitHub 远程时显示的消息：他们现在要求在 https://github.com/new 创建存储库，并且`/ultrareview`不再建议`gh`拒绝的`gh`命令"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Improved SSL certificate errors to name the likely causes, among them a server that leaves out an intermediate certificate, and the fix for each", "中文内容": "改进了 SSL 证书错误以列出可能的原因，其中包括遗漏中间证书的服务器，以及每个问题的修复方法"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Changed auto mode so that an `autoMode.allow` list without `\"$defaults\"` no longer removes the built-in rule on scheduled-task prompts", "中文内容": "更改了自动模式，以便没有“$defaults”的`autoMode.allow`列表不再删除计划任务提示上的内置规则"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "Changed server-managed settings for Team and Enterprise logins: settings fetched from Anthropic's API now apply without an approval prompt, and a stored copy that doesn't verify is refused", "中文内容": "更改了团队和企业登录的服务器管理设置：从 Anthropic 的 API 获取的设置现在无需批准提示即可应用，并且拒绝未验证的存储副本"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "[VSCode] Added sign-in to a Claude apps gateway from the chat panel, with no terminal needed", "中文内容": "[VSCode] 添加了从聊天面板登录 Claude 应用程序网关的功能，无需终端"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "[VSCode] Changed `ultrathink` to run its turn at `xhigh` effort and show in a rainbow in the chat box, as in the terminal", "中文内容": "[VSCode] 更改了`ultrathink`，使其以`xhigh`的速度运行，并在聊天框中以彩虹形式显示，就像在终端中一样"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[VSCode] Fixed the missing Effort slider, Ultracode switch and model name when the model setting has the `[1m]` tag, such as `opus[1m]`", "中文内容": "[VSCode] 修复了当模型设置具有`[1m]`标签（例如`opus[1m]`）时缺少 Effort 滑块、Ultracode 开关和模型名称的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[VSCode] Fixed saved `/btw` side-question history being deleted too early while a settings file has errors", "中文内容": "[VSCode] 修复了在设置文件有错误时过早删除已保存的`/btw`附带问题历史记录的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[VSCode] Fixed a conversation coming back in Auto mode after a reload or restart when its plan was approved with \"Yes, and manually approve edits\"", "中文内容": "[VSCode] 修复了当计划通过“是，并手动批准编辑”获得批准时，重新加载或重新启动后对话会返回自动模式的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "[Cloud sessions] Added a form card to cloud sessions, so you can fill in or decline a form an MCP server asks for instead of the request being canceled without you seeing it", "中文内容": "[云会话] 向云会话添加了表单卡，因此您可以填写或拒绝 MCP 服务器要求的表单，而不是在您看不到请求的情况下取消请求"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "[Cloud sessions] Added a \"Catching up…\" line that shows while a cloud or Remote Control session you switch back to is still bringing its messages up to date", "中文内容": "[云会话] 添加了一条“正在跟进...”行，显示您切换回的云或远程控制会话仍在更新其消息"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "[Cloud sessions] Changed network secrets so Enterprise members can add and delete them on their own cloud environments, instead of only viewing them", "中文内容": "[云会话]更改了网络机密，以便企业成员可以在自己的云环境中添加和删除它们，而不仅仅是查看它们"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "[Cloud sessions] Improved the Changes pane for cloud sessions: the note about what the list leaves out is now a badge beside the branch name, not a row above the diff", "中文内容": "[云会话] 改进了云会话的“更改”窗格：有关列表遗漏内容的注释现在是分支名称旁边的徽章，而不是差异上方的行"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[Cloud sessions] Fixed file search in a cloud session's Files pane showing folders as ../.. paths after Claude changed directory; results now show their path from the project's root", "中文内容": "[云会话] 修复了克劳德更改目录后，云会话的“文件”窗格中的文件搜索将文件夹显示为 ../.. 路径；结果现在显示了从项目根开始的路径"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[Claude Tag] Fixed Claude refusing to edit or append to a canvas it made in a Slack channel, from that channel, once the canvas was also shared to another channel or a DM", "中文内容": "[Claude Tag] 修复了当画布也共享到另一个频道或 DM 时，Claude 拒绝从该频道编辑或附加到其在 Slack 频道中制作的画布的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[Claude Tag] Fixed untagged replies going unanswered in a Slack Connect thread when both organizations have installed Claude and Slack delivered the reply to the other organization's app", "中文内容": "[Claude Tag] 修复了当两个组织都安装了 Claude 并且 Slack 将回复传送到另一个组织的应用程序时，Slack Connect 线程中未标记的回复未得到答复的问题"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "修复", "内容": "[Claude Tag] Fixed a cloud scheduled task's live status checklist in Slack staying half-done; a run can now edit the top-level messages it posted during that run", "中文内容": "[Claude Tag] 修复了 Slack 中云计划任务的实时状态清单未完成的问题；运行现在可以编辑该运行期间发布的顶级消息"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "改进", "内容": "[Claude Tag] Changed a Slack channel's Respond automatically switch to a \"How Claude participates\" choice on the channel's Configure page and in Claude Tag admin settings", "中文内容": "[Claude Tag] 更改了 Slack 频道的“响应”，在频道的“配置”页面和 Claude Tag 管理设置中自动切换为“Claude 如何参与”选项"}, {"日期": "2026-10-31", "版本": "2.1.316", "类型": "新增", "内容": "[Code Review] Added a findings-by-severity card to the Code Review analytics page, showing the period's total findings, a daily chart stacked by severity, and each severity's count", "中文内容": "[代码审查] 在代码审查分析页面中添加了按严重性划分的结果卡，显示该期间的总结果、按严重性堆叠的每日图表以及每个严重性的计数"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "新增", "内容": "Added `permissions.blockWritesOutsideWorkingDirectories`: Write, Edit and NotebookEdit refuse paths outside the working directories in every permission mode", "中文内容": "添加了`permissions.blockWritesOutsideWorkingDirectories`：在每个权限模式下，Write、Edit 和 NotebookEdit 拒绝工作目录之外的路径"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "新增", "内容": "Added an optional `groups` list to Claude apps gateway upstreams: only developers in the listed IdP groups are sent to that upstream, on failover too", "中文内容": "向 Claude 应用程序网关上游添加了可选的“组”列表：只有列出的 IdP 组中的开发人员才会被发送到该上游，故障转移时也是如此"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "新增", "内容": "Added `guardrail_trace` to Claude apps gateway Bedrock upstreams, to log which Amazon Bedrock guardrail filter fired on a request, without the matched text", "中文内容": "将`guardrail_trace`添加到 Claude 应用程序网关 Bedrock 上游，以记录哪个 Amazon Bedrock 护栏过滤器根据请求触发，无需匹配的文本"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "新增", "内容": "Added idle compaction to VS Code and Claude Desktop's Code tab: a 200K+ token conversation left idle is summarized, and the summary is used on your next message if the prompt cache has expired", "中文内容": "向 VS Code 和 Claude Desktop 的“代码”选项卡添加了空闲压缩：对闲置的 200K+ 令牌对话进行总结，如果提示缓存已过期，则该摘要将用于您的下一条消息"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed sessions failing turn after turn with \"Invalid effort level\" when an organization's admin caps a model's effort: Claude Code now lowers the effort, retries, and says which level it uses", "中文内容": "当组织的管理员限制模型的工作量时，修复了会话一次又一次失败并显示“无效的工作量级别”的问题：Claude Code 现在会降低工作量，重试，并说明它使用哪个级别"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `claude -p` exiting with code 0 and no output when startup failed; it now prints the error and exits 1", "中文内容": "修复了`claude -p`在启动失败时以代码 0 退出且无输出的问题；现在打印错误并退出 1"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed Bedrock sessions with many images failing every turn and `/compact` with \"400 Input is too long.\" instead of removing older images and compacting", "中文内容": "修复了基岩会话中许多图像每回合都会失败以及`/compact`“400 输入太长”的问题。而不是删除旧图像并压缩"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed Microsoft Foundry sessions failing when the resource has no deployment for the default Sonnet, Opus or Haiku model: Claude Code now falls back to an older model of that family", "中文内容": "修复了当资源没有部署默认 Sonnet、Opus 或 Haiku 模型时 Microsoft Foundry 会话失败的问题：Claude Code 现在回退到该系列的旧模型"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed repeated refused requests behind a gateway that doesn't accept tool search's `tool_reference` blocks: the request is sent again once without tool search, and the session remembers", "中文内容": "修复了不接受工具搜索的`tool_reference`块的网关后面重复拒绝的请求：请求在没有工具搜索的情况下再次发送一次，并且会话会记住"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed TLS connections failing with `UNABLE_TO_GET_ISSUER_CERT` when the system certificate store holds a renewed root certificate that is cross-signed with its predecessor", "中文内容": "修复了当系统证书存储持有与其前身交叉签名的续订根证书时，TLS 连接失败并显示`UNABLE_TO_GET_ISSUER_CERT`的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed MCP servers that also work without sign-in showing \"needs authentication\" after their stored sign-in stopped working; they are now used signed out", "中文内容": "修复了在存储的登录停止工作后，无需登录也可以工作的 MCP 服务器显示“需要身份验证”的问题；它们现在用于注销"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `claude mcp logout` reporting success when the MCP sign-in was not removed, for example while the macOS keychain is locked over SSH", "中文内容": "修复了未删除 MCP 登录时（例如，通过 SSH 锁定 macOS 钥匙串时）`claude mcp logout`报告成功的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed extra sign-in renewals when several sessions share an Anthropic profile login and the credentials lock is busy", "中文内容": "修复了当多个会话共享 Anthropic 配置文件登录且凭据锁繁忙时额外的登录续订问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `claude ultrareview` and `claude remote-control` asking the workspace trust question in a CI job that has a terminal; with `CI` set they now refuse an untrusted folder at once", "中文内容": "修复了`claude ultrareview`和“claude Remote-control”在具有终端的 CI 作业中询问工作区信任问题的问题；设置`CI`后，他们现在立即拒绝不受信任的文件夹"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed an administrator's TLS trust settings in managed settings not being applied in Claude Desktop sessions", "中文内容": "修复了托管设置中管理员的 TLS 信任设置未应用于 Claude Desktop 会话的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed model switching being refused on machines with managed plugin settings when one of your own `--plugin-dir` or `--plugin-url` plugins had a broken manifest or failed to download", "中文内容": "修复了当您自己的`--plugin-dir`或`--plugin-url`插件之一的清单损坏或无法下载时，在具有托管插件设置的计算机上拒绝模型切换的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the Bedrock and Vertex model upgrade offer coming back at every start when managed settings pin the model", "中文内容": "修复了当托管设置固定模型时基岩和顶点模型升级优惠在每次启动时都会返回"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `forceRemoteSettingsRefresh` set only in remote managed settings no longer applying once the stored copy had expired, which let sessions start without policy when the server could not be reached", "中文内容": "修复了仅在远程管理设置中设置的`forceRemoteSettingsRefresh`，一旦存储的副本过期就不再应用，这使得会话在无法访问服务器时无需策略即可启动"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed \"Continue automatically at usage limit\" continuing more than three times without a prompt from you when a task restarted itself between waits (a /goal check-in, a background or scheduled task)", "中文内容": "修复了当任务在等待之间自行重新启动时，“在使用限制下自动继续”持续超过 3 次而没有提示的问题（/目标签入、后台或计划任务）"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed background and cloud sessions started with Ultracode turning it back on at their next start after it had been switched off", "中文内容": "修复了后台和云会话启动时 Ultracode 在关闭后下次启动时将其重新打开的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the last broken reply and its retry prompts staying in the conversation after Claude gave up on a tool call that could not be parsed", "中文内容": "修复了克劳德放弃无法解析的工具调用后最后一个损坏的回复及其重试提示留在对话中的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed a PreCompact hook with very large output making compaction fail or repeat; each hook's output is now cut at 10,000 characters", "中文内容": "修复了具有非常大输出的 PreCompact 钩子导致压缩失败或重复的问题；每个钩子的输出现在被削减为 10,000 个字符"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed background diff refreshes briefly taking the repository's index lock, which could make a git command run at the same moment fail with \"Unable to create '.git/index.lock': File exists\"", "中文内容": "修复了背景差异刷新短暂获取存储库索引锁定的问题，这可能会使同时运行的 git 命令失败，并显示“无法创建‘.git/index.lock’：文件存在”"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed markdown tables jumping between grid and stacked layouts on half-typed rows while streaming, and long tables falling back to raw pipes", "中文内容": "修复了流式传输时，降价表在网格和半类型行上的堆叠布局之间跳转，以及长表回落到原始管道的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the /resume picker showing the text of CLAUDE.md or CLAUDE.local.md as a session's title when the session only ran slash commands", "中文内容": "修复了当会话仅运行斜杠命令时 /resume 选择器将 CLAUDE.md 或 CLAUDE.local.md 的文本显示为会话标题的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `/btw` answering from the main conversation when asked from a subagent's open transcript", "中文内容": "修复了当从子代理的开放记录中询问时从主对话中回答`/btw`"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed pasting an image over SSH to a Linux machine doing nothing silently; the prompt now says to copy the file over and paste its path", "中文内容": "修复了通过 SSH 将图像粘贴到 Linux 机器上不执行任何操作的问题；现在提示说复制文件并粘贴其路径"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `claude remote-control` sessions that failed to start when the session service was slow for a moment: the worker's registration is now retried with growing waits", "中文内容": "修复了当会话服务暂时缓慢时无法启动的“克劳德远程控制”会话：现在随着等待时间的增加，工作人员的注册将被重试"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed model switches over Remote Control that take over 8 seconds getting a \"still pending\" error instead of the final result", "中文内容": "修复了模型切换远程控制需要超过 8 秒的时间，出现“仍待处理”错误而不是最终结果的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the `sandbox.excludedCommands` setting description saying listed commands always run outside the sandbox; it now says every command in a call must match an entry", "中文内容": "修复了`sandbox.excludedCommands`设置描述，指出列出的命令始终在沙箱外运行；现在它说调用中的每个命令都必须与一个条目匹配"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed shell and MCP calls that auto mode, a deny rule or a PreToolUse hook blocked, or that otherwise did not run, reading as if they ran in a collapsed tool group", "中文内容": "修复了自动模式、拒绝规则或 PreToolUse 挂钩被阻止或未运行的 shell 和 MCP 调用，读起来就好像它们在折叠的工具组中运行一样"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed sandbox protections not applying to a worktree entered by `claude -p --resume` or `--continue`", "中文内容": "修复了沙箱保护不适用于通过`claude -p --resume`或`--continue`输入的工作树"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed hooks matching Bash not running on shell commands started by the Monitor tool; such hooks can block or ask, but not approve or rewrite those commands", "中文内容": "修复了与 Bash 匹配的钩子无法在 Monitor 工具启动的 shell 命令上运行的问题；此类挂钩可以阻止或询问，但不能批准或重写这些命令"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed a settings file excluded with `--setting-sources` still supplying some settings, such as auto mode rules and saved permission consents", "中文内容": "修复了`--setting-sources`排除的设置文件仍然提供一些设置，例如自动模式规则和保存的权限同意"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed auto mode reporting a call as blocked, and listing it in `/permissions`, when its safety check gave no verdict", "中文内容": "修复了自动模式在安全检查未给出结论时将呼叫报告为已阻止并将其列在“/权限”中的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed a Claude apps gateway Vertex upstream hanging for minutes when a Google token endpoint accepts the connection and never answers", "中文内容": "修复了当 Google 令牌端点接受连接且从不应答时 Claude 应用程序网关 Vertex 上游挂起几分钟的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the Claude apps gateway's start-up warning for a deprecated Claude Desktop key that it still serves as written saying \"stops being accepted\" after the key's end date", "中文内容": "修复了克劳德应用程序网关对已弃用的克劳德桌面密钥的启动警告，该警告在密钥结束日期后仍按书面形式显示“停止被接受”"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `/upgrade` opening the browser and starting a new login for plans billed through the App Store or Google Play; it now says where to change the plan", "中文内容": "修复了`/upgrade`打开浏览器并为通过 App Store 或 Google Play 计费的计划启动新登录的问题；现在它说在哪里更改计划"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `--resume`, and rewinding past a switch to another model after a refusal, moving a session on a model name Claude Code doesn't recognize to a different model", "中文内容": "修复了`--resume`，并在拒绝后倒回切换到另一个模型，将模型名称上的会话移动到 Claude Code 无法识别到其他模型"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed requests failing when a gateway or cloud provider refuses one of Claude Code's beta headers by name: the request is sent again without it", "中文内容": "修复了当网关或云提供商按名称拒绝 Claude Code 的 beta 标头之一时请求失败的问题：请求在没有它的情况下再次发送"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed model IDs spelled with a dot behind an LLM gateway, such as `claude-opus-4.8`, being treated as an older model with the wrong context window, output limit, effort, thinking mode and cost", "中文内容": "修复了 LLM 网关后面用点拼写的模型 ID，例如`claude-opus-4.8`，被视为具有错误上下文窗口、输出限制、工作量、思维模式和成本的旧模型"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed Remote Control clients showing a stray \"Compacted (ctrl+o to see full summary)\" row after /compact", "中文内容": "修复了远程控制客户端在 /compact 之后显示杂散的“Compacted（ctrl+o 查看完整摘要）”行"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the cloud sessions tip and the Remote Control idle notice showing when an organization's policy turns those features off", "中文内容": "修复了组织策略关闭这些功能时显示的云会话提示和远程控制空闲通知"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed a resumed claude.ai cloud session making a model call nobody asked for when the previous worker stopped just after receiving a new chat's files", "中文内容": "修复了一个恢复的 claude.ai 云会话，当前一个工作人员在收到新的聊天文件后立即停止时，无人要求进行模型调用"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed WebFetch in Cowork cloud sessions silently dropping a PDF's text past 100,000 characters; it now says how much was unread and where to read on", "中文内容": "修复了 Cowork 云会话中的 WebFetch 静默删除超过 100,000 个字符的 PDF 文本的问题；现在它会显示有多少内容未读以及在哪里继续阅读"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed Claude being told only that a command was declined after you stopped it with Esc or Stop in a cloud session or the IDE; it now also hears that the command may have run", "中文内容": "修复了在云会话或 IDE 中使用 Esc 或 Stop 停止命令后，Claude 仅被告知命令被拒绝的问题；现在它还得知该命令可能已运行"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed blank lines at the top of a code block disappearing when the code block opens a quote", "中文内容": "修复了当代码块打开引用时代码块顶部的空白行消失的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed a blank line appearing above some `⎿` rows in the transcript view (Ctrl+O)", "中文内容": "修复了转录视图中某些`⎿`行上方出现的空行（Ctrl+O）"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed vim mode `dw`, `dW`, `yw` and `yW` carrying on past the end of the line, and made `w` and `W` stop on empty lines", "中文内容": "修复了 vim 模式 `dw`、`dW`、`yw` 和 `yW` 超出行尾的问题，并使 `w` 和 `W` 在空行上停止"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed x and Enter in the agent panel sometimes acting on the wrong agent when another agent started or finished", "中文内容": "修复了当另一个代理启动或完成时，代理面板中的 x 和 Enter 有时会作用于错误的代理"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed pasted text and dragged-in files being lost in Claude's question dialog unless the \"Other\" row had focus", "中文内容": "修复了粘贴的文本和拖入的文件在克劳德的问题对话框中丢失的问题，除非“其他”行具有焦点"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed pasted text being lost when a row in the prompt footer was selected", "中文内容": "修复了选择提示页脚中的一行时粘贴的文本丢失的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed vim mode `p` over a character selection ignoring whether the yanked text was whole lines", "中文内容": "修复了字符选择上的 vim 模式`p`，忽略拉出的文本是否是整行"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed vim mode `aw` and `iw` taking the line break at the end of a line", "中文内容": "修复了 vim 模式 `aw` 和 `iw` 在行尾换行的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed ↓ selecting footer items hidden by the ? help menu, the command list or a paste hint", "中文内容": "修复了 ↓ 选择被 ? 隐藏的页脚项目帮助菜单、命令列表或粘贴提示"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed Esc on a command's panel, such as `/btw`, also interrupting the subagent whose transcript is open", "中文内容": "修复了命令面板上的 Esc（例如`/btw`）也会中断转录本打开的子代理的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the welcome header in fullscreen mode showing the session's model while viewing a subagent or teammate that runs on a different model", "中文内容": "修复了在全屏模式下显示会话模型的欢迎标题，同时查看在不同模型上运行的子代理或队友"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the fullscreen transcript being left mid-conversation after \"Restore conversation\" in the rewind menu while scrolled up", "中文内容": "修复了向上滚动时倒带菜单中的“恢复对话”后，全屏记录在对话中留下的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed a rare case where a deleted session could reappear in the resume list as an almost empty entry", "中文内容": "修复了一种罕见的情况，即已删除的会话可能会作为几乎空的条目重新出现在简历列表中"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed prompts containing tags such as `<bash-stdout>` or `<local-command-stdout>` not being acknowledged to a local stream-json host", "中文内容": "修复了包含`<bash-stdout>`或`<local-command-stdout>`等标签的提示未被本地stream-json主机确认"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed sessions staying untitled when the first prompt failed (for example on a usage limit) and the conversation continued afterward", "中文内容": "修复了当第一次提示失败（例如使用限制）并且对话随后继续时会话保持无标题的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the skill file watcher checking every removed skill kept in `~/.claude/skills/.trash`, which added file system load that grew with each removal", "中文内容": "修复了技能文件观察器检查`~/.claude/skills/.trash`中保存的每个已删除技能，这增加了随着每次删除而增长的文件系统负载"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the session name from /rename disappearing while Claude asks for permission or a plan decision, so side-by-side sessions stay identifiable", "中文内容": "修复了克劳德请求许可或计划决定时 /rename 中的会话名称消失的问题，因此并排会话保持可识别性"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed background sessions that fail to start being reported as a deleted daemon binary when the binary is still on disk", "中文内容": "修复了当二进制文件仍在磁盘上时无法开始将后台会话报告为已删除的守护程序二进制文件的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the tip and idle reminder about push notifications appearing when the push settings in `/config` are hidden or your organization has turned off Remote Control", "中文内容": "修复了当隐藏`/config`中的推送设置或您的组织已关闭远程控制时出现的有关推送通知的提示和空闲提醒"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed `~/.claude/skills/.trash` and `~/.claude/plugins/.trash` growing without limit: each now holds about 1024 entries, whatever `cleanupPeriodDays` says", "中文内容": "修复了 `~/.claude/skills/.trash` 和 `~/.claude/plugins/.trash` 无限制增长的问题：每个条目现在拥有大约 1024 个条目，无论 `cleanupPeriodDays` 说什么"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Fixed the Bash edit diff listing a whole file as changed when a CRLF file under git's line-ending conversion was re-saved unchanged or had one line edited", "中文内容": "修复了当 git 的行结束转换下的 CRLF 文件重新保存不变或编辑了一行时，Bash 编辑差异列出了整个文件已更改的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "Self-hosted runner: Fixed an idle session moving to another runner instead of pausing when the runner's request to pause it lost its connection before Anthropic answered", "中文内容": "自托管运行器：修复了当运行器的暂停请求在 Anthropic 应答之前丢失连接时，空闲会话移动到另一个运行器而不是暂停的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved memory use in long headless and SDK turns that run many subagents: the parent session no longer keeps each subagent's tool results until the turn ends", "中文内容": "改进了运行许多子代理的长无头和 SDK 轮次中的内存使用情况：父会话不再保留每个子代理的工具结果，直到轮次结束"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved prompt history: Ctrl+R now matches text inside collapsed `[Pasted text]` pills", "中文内容": "改进的提示历史记录：Ctrl+R 现在匹配折叠的“[粘贴文本]”药丸内的文本"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved the `/design-sync` upload prompt to show the folder, the project and the files it will upload or delete", "中文内容": "改进了`/design-sync`上传提示以显示文件夹、项目及其将上传或删除的文件"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved `/permissions` review tab, now called Recently blocked: the footer says what Esc will do with marked rows", "中文内容": "改进了`/permissions`查看选项卡，现在称为“最近被阻止”：页脚显示 Esc 将如何处理标记的行"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved auto mode's blocked calls: messages name the command, say Claude may retry and auto mode checks again, and point to `/permissions` to review", "中文内容": "改进了自动模式的阻止呼叫：消息命名命令，说克劳德可以重试并再次自动模式检查，并指向“/权限”进行审查"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved permission prompts: a long reason takes fewer rows, so it pushes the command being approved off the screen on fewer terminals", "中文内容": "改进的权限提示：较长的原因需要较少的行，因此它将在较少的终端上将正在批准的命令推离屏幕"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved the cloud session error shown while a request refused for your claude.ai login is still being retried: it now also suggests `claude auth login`", "中文内容": "改进了在重试 claude.ai 登录请求被拒绝时显示的云会话错误：它现在还建议`claude auth login`"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved the behavior of stored claude.ai, Team, and Enterprise logins when MDM and remote settings differ on base URL or `apiKeyHelper`", "中文内容": "改进了当 MDM 和远程设置在基本 URL 或`apiKeyHelper`上不同时存储的 claude.ai、团队和企业登录的行为"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved `/config` in agent view to say how to stop agent view opening by default", "中文内容": "改进了代理视图中的`/config`，以说明如何默认停止打开代理视图"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved session auto-titles: a session that starts with a skill or a prompt-based command such as `/security-review` now gets a title from it instead of staying untitled", "中文内容": "改进的会话自动标题：以技能或基于提示的命令（例如`/security-review`）启动的会话现在可以从中获取标题，而不是保持无标题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved `--resume` speed and memory use on damaged transcripts", "中文内容": "改进了受损转录本的`--resume`速度和内存使用"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Improved `/context` speed in sessions with ten thousand or more MCP tools", "中文内容": "提高了使用一万个或更多 MCP 工具进行会话时的`/context`速度"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Self-hosted runner: Improved the error shown when a session's branch isn't on the git remote: it now covers a never-pushed branch, says how to fix each case, and no longer suggests retrying", "中文内容": "自托管运行器：改进了当会话的分支不在 git 远程上时显示的错误：它现在涵盖从未推送的分支，说明如何修复每种情况，并且不再建议重试"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Updated the `/claude-api` skill: its Datadog setup for API tracing now sends the `dd-llmobs-enabled: true` header, as the Console does, and its `ant` install instructions drop the outdated macOS `xattr` step", "中文内容": "更新了`/claude-api`技能：其用于 API 跟踪的 Datadog 设置现在会发送`dd-llmobs-enabled: true`标头，就像控制台一样，并且其`ant`安装指令会删除过时的 macOS`xattr`步骤"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Updated the bundled dataviz skill to advise printing y-axis tick labels in full under 10,000, and horizontal ones in full under a million where they fit", "中文内容": "更新了捆绑的 dataviz 技能，建议在适合的情况下打印完整的 y 轴刻度标签（小于 10,000）和水平刻度标签（小于一百万）"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Updated the bundled dataviz skill to answer donut and pie chart requests with ranked bars or a segmented bar that prints its values", "中文内容": "更新了捆绑的数据可视化技能，以使用排名条形图或打印其值的分段条形图来回答圆环图和饼图请求"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed Claude's file tools to ask before editing the local copy of your organization's server-managed settings, as they do for your settings files", "中文内容": "更改了克劳德的文件工具，在编辑组织的服务器管理设置的本地副本之前进行询问，就像它们对设置文件所做的那样"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed `/ultrareview` to check workspace trust before it runs git, as `claude ultrareview` does", "中文内容": "更改了`/ultrareview`以在运行 git 之前检查工作区信任，就像`claude ultrareview`那样"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed the Bash tool's shell to clear any inherited `which` alias or function and to stop passing exported `which`/`unsetenv` functions to commands, so `which` is the system command or zsh builtin", "中文内容": "更改了 Bash 工具的 shell，以清除任何继承的 `which` 别名或函数，并停止将导出的 `which`/`unsetenv` 函数传递给命令，因此 `which` 是系统命令或 zsh 内置命令"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed `/permissions` Recently blocked to refuse approving a call you can't read in full, including one the terminal is too short to show", "中文内容": "更改了`/permissions`最近被阻止拒绝批准您无法完整阅读的呼叫，包括终端太短而无法显示的呼叫"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed auto mode in Cowork cloud sessions: a hook's allow of an MCP tool call now counts as no answer, so the classifier or a permission prompt decides", "中文内容": "更改了 Cowork 云会话中的自动模式：挂钩允许 MCP 工具调用现在算作无应答，因此由分类器或权限提示决定"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed hook `if` conditions such as `Monitor(tail *)` to match the Monitor tool's shell commands as `Bash(tail *)` matches Bash's", "中文内容": "更改了钩子`if`条件，例如`Monitor(tail *)`，以匹配 Monitor 工具的 shell 命令，因为`Bash(tail *)`与 Bash 的匹配"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed the `claude-api` skill to ask to read a Managed Agents workflow run's workflow before changing the agent to improve that run", "中文内容": "更改了`claude-api`技能，要求在更改代理以改进运行之前读取托管代理工作流运行的工作流"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed flagged requests to retry on another model, not end in a refusal, when `ANTHROPIC_DEFAULT_OPUS_MODEL`, `availableModels` or `deniedModels` leaves only an older Opus model, or none", "中文内容": "当`ANTHROPIC_DEFAULT_OPUS_MODEL`、`availableModels`或`deniedModels`仅留下较旧的 Opus 模型或没有留下任何模型时，更改了在另一个模型上重试的标记请求，而不是以拒绝结束"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed idle compaction to also run for subscribers with telemetry turned off, and on Bedrock, Vertex, Foundry and LLM gateways once the one-hour prompt cache is on", "中文内容": "更改了空闲压缩，以便在遥测关闭的情况下也为订阅者运行，并且一旦一小时提示缓存打开，就可以在 Bedrock、Vertex、Foundry 和 LLM 网关上运行"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "Changed `FORCE_HYPERLINK=false` (also `no` and `off`) to turn hyperlinks off instead of on", "中文内容": "更改了`FORCE_HYPERLINK=false`（还有`no`和`off`）以关闭而不是打开超链接"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "macOS: Changed `git grep` in most commands that Claude runs to use the C locale, to avoid a reported memory leak in macOS's regex library on files that aren't valid UTF-8", "中文内容": "macOS：更改了 Claude 运行的大多数命令中的`git grep`以使用 C 语言环境，以避免 macOS 的正则表达式库中报告的非有效 UTF-8 文件的内存泄漏"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[VSCode] Fixed \"Clear authentication\" for MCP servers reporting success when the saved sign-in could not be removed", "中文内容": "[VSCode] 修复了在无法删除保存的登录信息时报告成功的 MCP 服务器的“清除身份验证”问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[VSCode] Fixed missing spinner and Stop button while a queued message's hooks run", "中文内容": "[VSCode] 修复了排队消息的挂钩运行时丢失的微调器和停止按钮"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[VSCode] Fixed session group changes that cannot be saved, such as a delete, failing silently; an error notification now appears", "中文内容": "[VSCode] 修复了无法保存的会话组更改，例如删除，静默失败；现在出现错误通知"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[VSCode] Fixed Cmd+F / Ctrl+F not opening the find widget in the plan preview tab", "中文内容": "[VSCode] 修复了 Cmd+F / Ctrl+F 未在计划预览选项卡中打开查找小部件的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[VSCode] Fixed the voice dictation shortcut (Ctrl+D) doing nothing under non-Latin keyboard layouts such as Russian, Greek or Hebrew", "中文内容": "[VSCode] 修复了语音听写快捷键 (Ctrl+D) 在非拉丁键盘布局（例如俄语、希腊语或希伯来语）下不执行任何操作的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[VSCode] Fixed missed one-time saved scheduled tasks being deleted without asking when the extension opened without a chat", "中文内容": "[VSCode] 修复了错过的一次性保存的计划任务被删除而不询问扩展程序何时在没有聊天的情况下打开的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "[VSCode] Changed `CLAUDE_CODE_DISABLE_CFC_PROMPT` to also stop the extension adding the Claude in Chrome instructions to a session's messages; the browser tools stay available", "中文内容": "[VSCode] 更改了`CLAUDE_CODE_DISABLE_CFC_PROMPT`，以阻止扩展程序将 Chrome 中的 Claude 指令添加到会话消息中；浏览器工具保持可用"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "新增", "内容": "[Cloud sessions] Added an Include completed button to the Scheduled tasks page when finished one-off tasks are the only ones hidden, so you can show them without opening the Sort menu", "中文内容": "[云会话] 当完成的一次性任务是唯一隐藏的任务时，在“计划任务”页面中添加了“包含已完成”按钮，这样您就可以在不打开“排序”菜单的情况下显示它们"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Cloud sessions] Fixed recently used self-hosted environments never appearing among the recent environments on the new session card", "中文内容": "[云会话]修复了最近使用的自托管环境从未出现在新会话卡上的最近环境中的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Cloud sessions] Fixed cloud sessions reporting uncommitted changes every turn after Claude moved a branch to a commit it had pushed from another worktree", "中文内容": "[云会话]修复了克劳德将分支移动到从另一个工作树推送的提交后，每次都会报告未提交更改的云会话"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Cloud sessions] Fixed the self-hosted environment details dialog in admin settings squeezing its content out of view in very short windows or at high zoom; the dialog now scrolls", "中文内容": "[云会话] 修复了管理设置中的自托管环境详细信息对话框，在非常短的窗口或高缩放比例下将其内容挤压到视图之外；对话框现在滚动"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Cloud sessions] Fixed the permission mode picker staying on Auto after a running cloud or Remote Control session refused the switch; it now shows the mode in use and tells you", "中文内容": "[云会话] 修复了正在运行的云或远程控制会话拒绝切换后，权限模式选择器停留在自动状态的问题；它现在显示正在使用的模式并告诉您"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "[Cloud sessions] Improved scheduled tasks: runs in Anthropic's cloud now load the plugins enabled on your claude.ai account", "中文内容": "[云会话] 改进的计划任务：在 Anthropic 的云中运行现在加载在您的 claude.ai 帐户上启用的插件"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "[Cloud sessions] Improved Test connection for GitHub Enterprise in admin settings to also connect the way cloud sessions do, and to warn you when that second test fails", "中文内容": "[云会话] 改进了管理设置中 GitHub Enterprise 的测试连接，也可以按照云会话的方式进行连接，并在第二次测试失败时向您发出警告"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "[Cloud sessions] Improved cloud session transcripts: a rename row now names the new title, and repository and environment lists show as a table instead of one line of JSON", "中文内容": "[云会话] 改进了云会话记录：重命名行现在命名新标题，存储库和环境列表显示为表格而不是一行 JSON"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "改进", "内容": "[Cloud sessions] Changed cloud sessions from the web, desktop and mobile apps to start even when a setup script exits with an error, instead of failing to start", "中文内容": "[云会话] 将 Web、桌面和移动应用程序中的云会话更改为即使在安装脚本因错误退出时也会启动，而不是无法启动"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Remote Control] Fixed the permission mode button in Remote Control sessions showing the wrong mode until you typed; while your computer is online it now shows the real mode on open", "中文内容": "[远程控制] 修复了远程控制会话中的权限模式按钮在您键入之前显示错误的模式；当您的计算机在线时，它现在显示打开的真实模式"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "新增", "内容": "[Claude Tag] Added a dismissible link to the Claude Tag API docs on the Bundles and Channels tabs in admin settings, for Enterprise organizations with Slack connected", "中文内容": "[Claude Tag] 在管理设置的“捆绑包”和“频道”选项卡上添加了指向 Claude Tag API 文档的可关闭链接，适用于已连接 Slack 的企业组织"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Claude Tag] Fixed `@Claude !restart` giving up after one failed workspace check in channels shared across Enterprise Grid workspaces; it now retries, then asks you to run it again", "中文内容": "[Claude Tag] 修复了`@Claude !restart`在跨企业网格工作区共享的通道中工作区签入失败后放弃的问题；它现在重试，然后要求您再次运行它"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Claude Tag] Fixed a second confirmation DM and channel note when you connect your Claude account from Slack twice from the same link within a few minutes", "中文内容": "[Claude Tag] 修复了当您在几分钟内通过同一链接两次从 Slack 连接 Claude 帐户时出现的第二次确认 DM 和频道注释"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Claude Tag] Fixed follow-up messages in Slack showing no sign of progress while Claude's session waits for a self-hosted runner; Claude now posts a wait notice in the thread", "中文内容": "[Claude Tag] 修复了当 Claude 的会话等待自托管运行程序时 Slack 中的后续消息显示没有进度迹象的问题；克劳德现在在线程中发布等待通知"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Claude Tag] Fixed Claude sometimes not answering a tag in its own thread in Slack Connect channels where both organizations have installed Claude", "中文内容": "[Claude Tag] 修复了 Claude 有时不会在两个组织都安装了 Claude 的 Slack Connect 通道中的自己的线程中回答标签的问题"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Claude Tag] Fixed Retry on plugin and skill pages in Claude Tag admin settings discarding unsaved access changes after a failed load; your edits now stay in place", "中文内容": "[Claude Tag] 修复了 Claude Tag 管理设置中的插件和技能页面上的重试问题，在加载失败后丢弃未保存的访问更改；您的编辑现在保留在原处"}, {"日期": "2026-10-30", "版本": "2.1.314", "类型": "修复", "内容": "[Claude Tag] Fixed the repositories control in Claude Tag admin settings showing the same action twice; its menu now lists only what the button doesn't already do", "中文内容": "[Claude Tag] 修复了 Claude Tag 管理设置中的存储库控件显示相同操作两次的问题；它的菜单现在只列出按钮尚未执行的操作"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "新增", "内容": "Added `oidc.user_id_claim` to the Claude apps gateway, to identify people by an id_token claim other than `sub`, such as Microsoft Entra ID's `oid`", "中文内容": "将`oidc.user_id_claim`添加到 Claude 应用程序网关，以通过`sub`以外的 id_token 声明来识别人员，例如 Microsoft Entra ID 的`oid`"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "新增", "内容": "Added click to send: in fullscreen, clicking the \"to send now\" hint under a queued message sends it right away, as its key does", "中文内容": "添加了单击发送：在全屏中，单击排队消息下方的“立即发送”提示会立即发送消息，就像其按键一样"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed managed settings and organization policy not being fetched for the rest of the session after signing in from the VS Code extension", "中文内容": "修复了从 VS Code 扩展登录后不会在会话的其余部分获取托管设置和组织策略的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed Claude overwriting a very large CLAUDE.md, rules file or @-included file in a subdirectory after seeing only its start; Write now asks Claude to read it all or edit in place", "中文内容": "修复了 Claude 在仅看到其开头后覆盖子目录中非常大的 CLAUDE.md、规则文件或 @-included 文件的问题；现在写要求克劳德阅读全部内容或就地编辑"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed per-directory and `paths:` skills not being found after a Bash `cd` deeper into a git repository", "中文内容": "修复了将 Bash `cd` 深入到 git 存储库后找不到每个目录和 `paths:` 技能的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed a rare case where the first reply after resuming a session in the terminal could be missing the next time the session was resumed", "中文内容": "修复了一种罕见的情况，即下次恢复会话时，终端中恢复会话后的第一个回复可能会丢失"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed a command with an invalid name stopping all commands from loading, which could leave `claude -p` with no output", "中文内容": "修复了名称无效的命令，阻止所有命令加载，这可能导致`claude -p`没有输出"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed the Read tool sometimes failing on PDF pages with \"pdftoppm failed: Could not write image\" when the clean-up of old session files ran at the same time", "中文内容": "修复了当同时运行旧会话文件的清理时，读取工具有时会在 PDF 页面上失败，并显示“pdftoppm 失败：无法写入图像”"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed the spinner, OpenTelemetry `effort` values and transcripts naming a newly picked effort level during a task before the model applied it; they now show the level in force", "中文内容": "修复了微调器、OpenTelemetry“工作量”值和成绩单，在模型应用任务期间命名新选择的工作量级别；他们现在显示有效的水平"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed the `/model` and `/effort` cache warning saying the re-read waits for your next message; a change made while Claude is working can trigger it sooner", "中文内容": "修复了`/model`和`/effort`缓存警告，表示重新读取等待您的下一条消息；克劳德工作时所做的改变可以更快地触发它"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed some sessions showing as waiting on you when the last message only mentioned items waiting on you mid-sentence", "中文内容": "修复了当最后一条消息仅提到在句子中等待您的项目时，某些会话显示为正在等待您"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed agent view restoring input text on the next launch after it was cleared with Ctrl+C just before exiting", "中文内容": "修复了代理视图在退出前使用 Ctrl+C 清除输入文本后在下次启动时恢复输入文本的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed agent view reopening in shell mode after exiting with Ctrl+D from an empty `!` input", "中文内容": "修复了从空`!`输入中使用 Ctrl+D 退出后以 shell 模式重新打开代理视图的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed vim mode `d`, `c` and `y` with a `gj` or `gk` count larger than the lines left deleting or copying text; like Vim, they now only move the cursor", "中文内容": "修复了 vim 模式`d`、`c`和`y`，其中`gj`或`gk`计数大于删除或复制文本时留下的行数；像 Vim 一样，他们现在只移动光标"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "Fixed `/verify` showing a long description meant for Claude in `/help` and the `/` command menu instead of a short one", "中文内容": "修复了`/verify`在`/help`和`/`命令菜单中显示针对克劳德的长描述，而不是短描述"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Improved the prompt's effort indicator: a change made mid-task now says it may wait for your next message, and the note clears when it no longer applies", "中文内容": "改进了提示的工作量指示器：任务中进行的更改现在表示它可能会等待您的下一条消息，并且当它不再适用时，注释会被清除"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Improved WebFetch errors in cloud sessions: a host that does not resolve is now explained as possibly outside the allowed network domains, so Claude names the host to allow", "中文内容": "改进了云会话中的 WebFetch 错误：无法解析的主机现在被解释为可能位于允许的网络域之外，因此 Claude 指定允许的主机"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed Bedrock, Vertex, Foundry and Mantle to use the shorter system prompt for model names Claude Code doesn't recognize, such as custom deployment names and inference profile ARNs, even when they front Sonnet or Haiku; set `CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=0` to keep the full prompt", "中文内容": "更改了 Bedrock、Vertex、Foundry 和 Mantle，以对 Claude Code 无法识别的模型名称使用较短的系统提示，例如自定义部署名称和推理配置文件 ARN，即使它们位于 Sonnet 或 Haiku 前面；设置`CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=0`以保留完整提示"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed automatic model switches after a flagged message to also cover model names Claude Code doesn't recognize, such as custom deployment names; set `CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK=1` to turn them off", "中文内容": "更改了标记消息后的自动模型切换，以涵盖 Claude Code 无法识别的模型名称，例如自定义部署名称；设置`CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK=1`将其关闭"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed usage limit messages to call the 5-hour window the \"5-hour limit\" instead of the \"session limit\"", "中文内容": "更改了使用限制消息，将 5 小时窗口称为“5 小时限制”而不是“会话限制”"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed cloud sessions started from the CLI to get their names and branch names from the server", "中文内容": "更改了从 CLI 启动的云会话，以从服务器获取其名称和分支名称"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed prompt and agent hooks to run at most 24 at a time per session, sub-agents included, plus at most 12 that have waited longer than their event's timeout; a `timeout` under 1 second now counts as 1 second", "中文内容": "将提示和代理挂钩更改为每个会话一次最多运行 24 个（包括子代理），加上最多 12 个等待时间超过其事件超时时间的挂钩； 1 秒以下的“超时”现在计为 1 秒"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed a subagent's `autoCompactWindow` to lower the window set by `CLAUDE_CODE_AUTO_COMPACT_WINDOW`, where it had no effect before; it still never raises that window", "中文内容": "更改了子代理的`autoCompactWindow`以降低由`CLAUDE_CODE_AUTO_COMPACT_WINDOW`设置的窗口，之前没有效果；它仍然没有升起那个窗口"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed OpenTelemetry `mcp_server.name` to report the real name of fixed-URL remote MCP servers declared by plugins from the official Anthropic marketplace, instead of `custom`", "中文内容": "更改了 OpenTelemetry `mcp_server.name` 以报告由官方 Anthropic 市场插件声明的固定 URL 远程 MCP 服务器的真实名称，而不是 `custom`"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "Changed Claude Code to stop sending the `claude_code.safety_event` OpenTelemetry event", "中文内容": "更改了 Claude Code 以停止发送 `claude_code.safety_event` OpenTelemetry 事件"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[VSCode] Fixed sessions ending on a bare exit code when your organization's settings couldn't be loaded or were refused at startup; the tab now says why and offers Retry or Sign in again", "中文内容": "[VSCode] 修复了当组织的设置无法加载或在启动时被拒绝时会话以裸退出代码结束的问题；该选项卡现在会说明原因并提供“重试”或“再次登录”选项"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "[VSCode] Changed usage limit resets to show a clock time (\"Resets at 3:10 PM\") and to say \"5-hour limit\"", "中文内容": "[VSCode] 更改了使用限制重置，以显示时钟时间（“下午 3:10 重置”）并显示“5 小时限制”"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "新增", "内容": "[Cloud sessions] Added an effort level to the model picker when you create or edit a routine that runs in the cloud", "中文内容": "[云会话] 当您创建或编辑在云中运行的例程时，向模型选择器添加了工作量级别"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "新增", "内容": "[Cloud sessions] Added a Bash editor with colors, line numbers and a Copy button to the setup script box in cloud environment settings", "中文内容": "[云会话] 在云环境设置中的设置脚本框中添加了带有颜色、行号和复制按钮的 Bash 编辑器"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "[Cloud sessions] Improved the step shown when Claude adds a repository to a cloud session: opening it now shows a short table of what happened instead of raw JSON", "中文内容": "[云会话] 改进了 Claude 将存储库添加到云会话时显示的步骤：现在打开它会显示发生的情况的简短表格，而不是原始 JSON"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Cloud sessions] Fixed resending an unchanged message after a failed send in a cloud session sometimes running it twice", "中文内容": "[云会话]修复了在云会话中发送失败后重新发送未更改的消息（有时会运行两次）的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Cloud sessions] Fixed a failed cloud environment creation showing its error only as a toast outside the open dialog; it now appears inside the dialog", "中文内容": "[云会话] 修复了云环境创建失败的问题，仅在打开的对话框之外显示其错误；它现在出现在对话框内"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Cloud sessions] Fixed Edit in a routine's menu on the Routines page going to the routine's page without opening its edit dialog", "中文内容": "[云会话] 修复了在“例程”页面上的例程菜单中编辑会转到例程页面而不打开其编辑对话框的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Remote Control] Fixed an unarchived Remote Control session showing as working until a computer reconnected; it now shows as idle", "中文内容": "[远程控制] 修复了未存档的远程控制会话在计算机重新连接之前显示为工作状态的问题；现在显示为空闲"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "改进", "内容": "[Claude Tag] Improved Claude Tag's retry notice in Slack to name the model in use, or say rate limits were hit, instead of a generic API error", "中文内容": "[Claude Tag] 改进了 Slack 中 Claude Tag 的重试通知，以命名正在使用的模型，或者说达到了速率限制，而不是通用 API 错误"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Claude Tag] Fixed a Claude Tag channel's on/off switch and agent settings falling back to workspace defaults when an older private Slack channel goes public and gets a new ID", "中文内容": "[Claude Tag] 修复了当旧的私有 Slack 频道公开并获取新 ID 时，Claude Tag 频道的开/关开关和代理设置回退到工作区默认值的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Claude Tag] Fixed Claude in Slack not replying in channels whose environment has network access set to None", "中文内容": "[Claude Tag] 修复了 Slack 中的 Claude 在环境网络访问设置为“无”的频道中不回复的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Claude Tag] Fixed Claude in Slack sometimes posting a file in the wrong thread when it was answering in another thread of the same channel", "中文内容": "[Claude Tag] 修复了 Slack 中的 Claude 有时在同一频道的另一个线程中回答时在错误的线程中发布文件的问题"}, {"日期": "2026-10-27", "版本": "2.1.312", "类型": "修复", "内容": "[Code Review] Fixed Code Review reviewing an outdated commit, or none at all, when GitHub delivered a push event late; it now reviews the pull request's current commit", "中文内容": "[代码审查] 修复了当 GitHub 延迟交付推送事件时代码审查会审查过时的提交，或根本不审查的问题；现在它会审查拉取请求的当前提交"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "新增", "内容": "Added `--hold-idle-file` and `--max-hold-min` to `self-hosted-runner`, to keep an idle session while your host reports processes it left running", "中文内容": "在`self-hosted-runner`中添加了`--hold-idle-file`和`--max-hold-min`，以在主机报告进程保持运行状态时保持空闲会话"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "新增", "内容": "Added a tip for the Explanatory output style, shown when you ask Claude for explanations", "中文内容": "添加了解释性输出样式的提示，当您向克劳德询问解释时显示"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed long freezes at startup and after reading or editing files when a CLAUDE.md file holds a very long list item", "中文内容": "修复了当 CLAUDE.md 文件包含非常长的列表项时启动时以及读取或编辑文件后长时间冻结的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed interrupting Claude not taking effect until a timeout while an MCP server had not answered a resource read or a skill was still downloading", "中文内容": "修复了当 MCP 服务器未响应资源读取或技能仍在下载时，中断克劳德直到超时才生效的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed standard-context sessions stopping with \"Usage credits required for 1M context\" when a request ran over 200K tokens; Claude Code now compacts the conversation and continues", "中文内容": "修复了当请求运行超过 200K 令牌时标准上下文会话因“1M 上下文所需的使用积分”而停止的问题；克劳德·科德现在压缩对话并继续"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Write and Edit stalling for up to 5 seconds after they ran, and reporting 0 lines changed, when changing thousands of lines in a file", "中文内容": "修复了写入和编辑在运行后停滞长达 5 秒，并在更改文件中的数千行时报告 0 行已更改的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed subagents being unable to use MCP tools from servers that finish connecting after the subagent starts", "中文内容": "修复了子代理无法从子代理启动后完成连接的服务器使用 MCP 工具的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Claude seeing stale MEMORY.md and CLAUDE.md content right after automatic compaction when those files were edited earlier in the session", "中文内容": "修复了当在会话早期编辑这些文件时，Claude 在自动压缩后立即看到过时的 MEMORY.md 和 CLAUDE.md 内容的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `claude -p` and SDK sessions saving transcript messages out of order or keeping messages that were taken back", "中文内容": "修复了`claude -p`和 SDK 会话保存无序转录消息或保留已收回的消息的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `SubagentStop` hooks running about twice a minute for each running subagent instead of once when it finishes", "中文内容": "修复了每个正在运行的子代理每分钟运行两次的`SubagentStop`挂钩，而不是完成时运行一次"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the @ file picker ignoring `.ignore`/`.rgignore` negation rules that re-include git-ignored files", "中文内容": "修复了 @ 文件选择器忽略重新包含 git 忽略的文件的 `.ignore`/`.rgignore` 否定规则"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed a subagent's isolated worktree being removed while a background subagent it started was still working in it", "中文内容": "修复了子代理的独立工作树被删除，而它启动的后台子代理仍在其中工作的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed background agents in auto mode that wait on their own shells starting a new main conversation turn on every wake", "中文内容": "修复了自动模式下的后台代理在每次唤醒时等待自己的 shell 开始新的主要对话的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the Bash tool description claiming the working directory always persists between calls", "中文内容": "修复了 Bash 工具描述，声称工作目录在调用之间始终保留"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the environment block naming a shell commands don't run in, such as fish when the Bash tool uses zsh", "中文内容": "修复了命名 shell 命令不运行的环境块，例如 Bash 工具使用 zsh 时的 Fish"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `claude mcp add`, `claude mcp remove` and `/mcp` naming the current folder instead of the project entry in `~/.claude.json` that holds a local-scope server when run below a repository root", "中文内容": "修复了`claude mcp add`、`claude mcp remove`和`/mcp`命名当前文件夹，而不是`~/.claude.json`中的项目条目，该条目在存储库根目录下运行时保存本地范围的服务器"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `claude mcp list` and `claude mcp get` showing the error code twice on failed-connection lines (for example `ENOENT: ENOENT: …`)", "中文内容": "修复了`claude mcp list`和`claude mcp get`在失败的连接线路上显示错误代码两次的问题（例如`ENOENT: ENOENT: …`）"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Remote Control sessions staying on \"Connecting\" for about two minutes when a network proxy blocks a startup request", "中文内容": "修复了当网络代理阻止启动请求时远程控制会话保持“正在连接”状态大约两分钟的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed messages that Claude sends to a cloud or Remote Control session appearing as your own message in the Claude mobile apps", "中文内容": "修复了克劳德发送到云或远程控制会话的消息在克劳德移动应用程序中显示为您自己的消息"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Claude not being told the cause when a file attached to a message sent over Remote Control or to a cloud session could not be saved because the disk was full, or that a message's attachments past the first 20 were left out", "中文内容": "修复了当通过远程控制发送的消息或云会话附加的文件因磁盘已满而无法保存，或者消息的前 20 个附件被遗漏时，克劳德没有被告知原因"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed WebFetch and WebSearch hanging on a stalled response in Cowork cloud sessions; an unfinished request now fails after 300 seconds", "中文内容": "修复了 Cowork 云会话中 WebFetch 和 WebSearch 响应停滞的问题；未完成的请求现在会在 300 秒后失败"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed a background session that crashed between turns not being restarted while it was attached, pinned, or had a scheduled task or wake-up set", "中文内容": "修复了后台会话在连接、固定或设置计划任务或唤醒时未重新启动的情况下崩溃的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the \"background service did not respond\" error suggesting the disabled `claude daemon restart`; it now suggests `claude daemon stop --any` and says it ends background sessions", "中文内容": "修复了“后台服务没有响应”提示禁用`claude daemon restart`的错误；它现在建议`claude daemon stop --any`并表示它结束后台会话"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `claude respawn <id>` starting the background service before reporting that no background session matches the id", "中文内容": "修复了`claude respawn <id>`在报告没有后台会话与 ID 匹配之前启动后台服务的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `/effort` not warning about a prompt cache miss in plan mode when the plan model differs from the session model", "中文内容": "修复了当计划模型与会话模型不同时，`/effort`不会在计划模式下警告提示缓存未命中的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `/ide` saying the VS Code extension was installed before the install finished or when it failed", "中文内容": "修复了`/ide`表示 VS Code 扩展在安装完成之前或安装失败时已安装的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the Write tool's file preview skipping rows and miscounting hidden lines when a line is wider than the terminal", "中文内容": "修复了当行比终端宽时，写入工具的文件预览会跳过行并错误计数隐藏行"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed ↑ in an agent's chat tab recalling a message that was still waiting to be delivered, so resending it sent a second copy", "中文内容": "修复了代理聊天选项卡中的 ↑ 召回仍在等待发送的消息，因此重新发送会发送第二份副本"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Cowork cloud sessions losing their connectors and most tools after a restart when a plugin or your settings named an `agent`; Cowork cloud sessions now ignore that setting", "中文内容": "修复了当插件或您的设置名为“代理”时，Cowork 云会话在重新启动后丢失其连接器和大多数工具的问题； Cowork 云会话现在忽略该设置"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed agent teams sessions showing an empty task list when coming back with `--resume`, `--continue`, `/resume` or `--session-id`, including after `/clear` or a crash, and `/branch` writing to the original session's list", "中文内容": "修复了代理团队会话在使用`--resume`、`--continue`、`/resume`或`--session-id`返回时显示空任务列表的问题，包括在`/clear`或崩溃之后以及`/branch`写入原始会话列表之后"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed pasting text that mentions an image file, such as `! open /tmp/shot.png` or `/review look at /tmp/shot.png`, attaching the image and dropping its path from the prompt", "中文内容": "修复了粘贴提及图像文件的文本，例如`!打开 /tmp/shot.png` 或 `/review Look at /tmp/shot.png`，附加图像并从提示中删除其路径"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the feedback draft card showing its 1/2/0 and Esc shortcuts while the prompt has text, when those keys act on the prompt instead of the card", "中文内容": "修复了当提示有文本时反馈草稿卡显示其 1/2/0 和 Esc 快捷键（当这些键作用于提示而不是卡片时）"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed a lone backslash in quotes or brackets, like `\"\\\"` or `(\\)`, disappearing from Claude's responses", "中文内容": "修复了引号或方括号中的单独反斜杠，例如“”\\“”或`(\\)`，从克劳德的回复中消失"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed agent teammates compacting their history when `DISABLE_COMPACT` is set", "中文内容": "修复了设置`DISABLE_COMPACT`时代理队友压缩历史记录的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the rewind menu offering \"Summarize from here\" and \"Summarize up to here\" when `DISABLE_COMPACT` is set", "中文内容": "修复了设置`DISABLE_COMPACT`时倒带菜单提供“从此处汇总”和“汇总到此处”的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed a finished `/code-review`, or another skill that runs in a sub-agent, running a second time when a cloud or background session restarts", "中文内容": "修复了已完成的`/code-review`或在子代理中运行的其他技能，在云或后台会话重新启动时第二次运行"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed long hidden thinking being cut off as idle on Google Vertex AI, Microsoft Foundry and Claude Platform on AWS, where the endpoint sends thinking progress updates", "中文内容": "修复了 AWS 上的 Google Vertex AI、Microsoft Foundry 和 Claude Platform 上长时间隐藏的思维被视为闲置而被切断的问题，其中端点发送思维进度更新"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `/ide` saying it had installed the JetBrains plugin when nothing was installed", "中文内容": "修复了`/ide`在未安装任何内容时显示已安装 JetBrains 插件的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Claude Pro and Max subscribers being told to ask their admin when their subscription can't be used; the message now points to billing settings", "中文内容": "修复了 Claude Pro 和 Max 订阅者被告知在无法使用订阅时询问管理员的问题；该消息现在指向计费设置"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the diff pane opening by itself after an edit in wide fullscreen terminals when it had nothing to show", "中文内容": "修复了在宽全屏终端中编辑后没有任何内容可显示的差异窗格自行打开的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `/mcp` showing a remote server as failed after \"Clear authentication\" when the server works without sign-in", "中文内容": "修复了当服务器在未登录的情况下工作时，`/mcp`在“清除身份验证”后显示远程服务器失败的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `/mcp` showing \"authenticated\" for a remote server that Claude Code sends no credentials to", "中文内容": "修复了克劳德代码未向其发送凭据的远程服务器显示“已验证”的`/mcp`"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed a `--plugin-dir` folder of plugins loading as one plugin when an empty `.mcp.json` was at its top", "中文内容": "修复了当空的`.mcp.json`位于顶部时，插件的`--plugin-dir`文件夹作为一个插件加载的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed `/usage` never showing large prompt-cache misses under \"What's contributing to your limits usage?\"", "中文内容": "修复了`/usage`在“什么导致了您的限制使用？”下永远不会显示大量提示缓存未命中的问题。"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed status line links staying plain text in background sessions after you open them from a terminal that supports links", "中文内容": "修复了从支持链接的终端打开状态行链接后，状态行链接在后台会话中保持纯文本的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the /rewind confirmation saying the conversation \"will be forked\" when the later messages are removed from the conversation", "中文内容": "修复了 /rewind 确认，当后面的消息从对话中删除时，对话“将被分叉”"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed the /rewind warning that wrongly said manual and Bash edits are never affected by a code restore", "中文内容": "修复了 /rewind 警告，该警告错误地表示手动和 Bash 编辑永远不会受到代码恢复的影响"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed plan approval in screen reader mode sending feedback you had dismissed with Escape", "中文内容": "修复了屏幕阅读器模式下的计划批准发送您通过 Escape 忽略的反馈"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Fixed Claude Code retrying requests the API marked not to retry, which could hold a turn for minutes or, in unattended retry mode (`CLAUDE_CODE_RETRY_WATCHDOG`), indefinitely", "中文内容": "修复了 Claude Code 重试请求标记为不重试的 API，这可能会持续几分钟，或者在无人值守重试模式 (`CLAUDE_CODE_RETRY_WATCHDOG`) 下无限期地等待"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Linux: Fixed sandboxed Bash commands failing with `bwrap: Can't create file` when a `--plugin-dir` folder was also an added directory and `permissions.blockReadsOutsideWorkingDirectories` was on", "中文内容": "Linux：修复了沙盒 Bash 命令因“bwrap：无法创建文件”而失败的问题，当`--plugin-dir`文件夹也是添加的目录并且`permissions.blockReadsOutsideWorkingDirectories`处于打开状态时"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "Self-hosted runner: Fixed a session failing to start when a rate limit (HTTP 429, or a git wrapper that exits 75) blocks an added read-only repository; it now starts without that repository", "中文内容": "自托管运行器：修复了当速率限制（HTTP 429 或退出 75 的 git 包装器）阻止添加的只读存储库时会话无法启动的问题；现在它在没有该存储库的情况下启动"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved startup time for Pro and Max accounts by skipping two network requests on launches within an hour of the last check", "中文内容": "通过在上次检查后一小时内启动时跳过两个网络请求，缩短了 Pro 和 Max 帐户的启动时间"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved `/teleport` and `claude --teleport` to warn when a compacted cloud session loads from its last compaction, so the messages it summarized aren't in the local copy", "中文内容": "改进了`/teleport`和`claude --teleport`，以在压缩的云会话从上次压缩加载时发出警告，因此它总结的消息不在本地副本中"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved the messages shown when a background session's process exits: they no longer promise a restart that isn't coming, and they say how to resume the session", "中文内容": "改进了后台会话进程退出时显示的消息：它们不再承诺不会重新启动，并且会说明如何恢复会话"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved artifacts with several views: Claude now routes each view on the link's `#name` and no longer says the address bar stays the same as you switch views", "中文内容": "改进了具有多个视图的工件：克劳德现在在链接的`#name`上路由每个视图，并且不再说切换视图时地址栏保持不变"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved shell commands that reach their timeout: the result now shows the output so far and says the command is still running in the background", "中文内容": "改进了达到超时的 shell 命令：结果现在显示到目前为止的输出，并表示该命令仍在后台运行"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved compaction: when the model's reply has no summary in it, Claude Code now usually asks for the summary once more before it replaces the conversation", "中文内容": "改进的压缩：当模型的回复中没有摘要时，Claude Code 现在通常会在替换对话之前再次询问摘要"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved the Artifact tool's choice between a page and a document: explainers and visual or interactive work become artifact pages; documents are for writing people keep editing or pass around", "中文内容": "改进了 Artifact 工具在页面和文档之间的选择：解释器和视觉或交互式作品成为 Artifact 页面；文件是用来写的，人们不断编辑或传递"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved startup time for launches whose only arguments are options and their values, such as `claude --model opus`", "中文内容": "改进了唯一参数是选项及其值的启动的启动时间，例如`claude --model opus`"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved the \"Connection dropped\" API error: it now says where to look first (the proxy or gateway in use, else VPN or firewall; Anthropic API only, Bedrock, Vertex and Foundry are unchanged)", "中文内容": "改进了“连接丢失”API 错误：它现在显示首先查看哪里（正在使用的代理或网关，否则 VPN 或防火墙；仅限 Anthropic API，Bedrock、Vertex 和 Foundry 未更改）"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved screen reader mode: deleting a rule in /permissions says \"Deleted allow rule …\" right away", "中文内容": "改进的屏幕阅读器模式：删除 /permissions 中的规则会立即显示“已删除允许规则...”"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved the message shown when a pasted sign-in code is refused: it now says the code may have expired or been used, and to sign in again", "中文内容": "改进了粘贴的登录代码被拒绝时显示的消息：现在显示该代码可能已过期或已被使用，并重新登录"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved Slack connector sends: Claude now checks a channel's topic for posting rules before messaging a channel you didn't name", "中文内容": "改进的 Slack 连接器发送：Claude 现在在向您未命名的频道发送消息之前检查频道主题的发布规则"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Improved screen reader mode: Claude's questions are listed as \"Questions: Color (answered), Pages\", without arrows or symbols", "中文内容": "改进的屏幕阅读器模式：克劳德的问题列为“问题：颜色（已回答），页面”，没有箭头或符号"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "Changed `ultrathink` in the interactive terminal to run its turn at xhigh effort on Opus 5.5, Sonnet -code#102799)", "中文内容": "[VSCode] 修复了从 VS Code 或 JetBrains 面板发送的自定义技能和自定义斜线命令，遗漏了普通消息包含的打开文件或选定行 (anthropics/claude-code#102799)"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "[VSCode] Fixed the extension host freezing while the login shell ran its start-up files to read PATH on macOS and Linux", "中文内容": "[VSCode] 修复了登录 shell 运行其启动文件以读取 macOS 和 Linux 上的 PATH 时扩展主机冻结的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "[VSCode] Fixed clicking an image in a tool result, or closing its preview, also opening the result's text in an editor tab", "中文内容": "[VSCode] 修复了单击工具结果中的图像或关闭其预览，同时在编辑器选项卡中打开结果的文本的问题"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "[VSCode] Fixed voice dictation continuing to record after a message was sent with the Send button; sending now stops dictation first, as pressing Enter already did", "中文内容": "[VSCode] 修复了使用“发送”按钮发送消息后语音听写继续录制的问题；现在发送首先停止听写，就像按 Enter 已经做的那样"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "[VSCode] Changed the extension to start Claude Code sessions with `DISABLE_TELEMETRY` set while VS Code's telemetry setting is off, so they send no usage metrics or error reports and fetch no feature flags", "中文内容": "[VSCode] 更改了扩展，以便在 VS Code 的遥测设置关闭时启动设置为`DISABLE_TELEMETRY`的 Claude Code 会话，因此它们不会发送使用指标或错误报告，也不会获取任何功能标志"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "[VSCode] Changed the session list side bar to load Web sessions when the Web tab is first opened, not at startup", "中文内容": "[VSCode] 更改了会话列表侧栏，以便在首次打开 Web 选项卡时加载 Web 会话，而不是在启动时加载"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "[Cloud sessions] Fixed routines in Anthropic-hosted environments staying locked after their owner left the organization and rejoined; the owner can now turn them back on", "中文内容": "[云会话] 修复了 Anthropic 托管环境中的例程在其所有者离开组织并重新加入后保持锁定状态；所有者现在可以重新打开它们"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "[Cloud sessions] Fixed a failed routine API token delete or regenerate showing nothing if the edit dialog had already closed; it now shows an error toast", "中文内容": "[云会话] 修复了如果编辑对话框已关闭，则例程 API 令牌删除或重新生成失败，不显示任何内容的问题；现在显示错误 toast"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "修复", "内容": "[Cloud sessions] Fixed cloud environment dialogs, including the admin dialog, accepting duplicate names; they now refuse a name another listed environment already has", "中文内容": "[云会话] 修复了云环境对话框（包括管理对话框）接受重复名称的问题；他们现在拒绝使用另一个列出的环境已经有的名称"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "新增", "内容": "[Claude Tag] Added a Skills view to Claude Tag analytics showing how often Claude runs each attached skill in Slack channels and which go unused, with Usage links in admin settings", "中文内容": "[Claude Tag] 在 Claude Tag 分析中添加了技能视图，显示 Claude 在 Slack 通道中运行每个附加技能的频率以及未使用的技能，并在管理设置中提供使用链接"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "[Claude Tag] Improved Claude Tag routines that run in a new session: a run with nothing to report can now end without posting a throwaway message to the channel", "中文内容": "[Claude Tag] 改进了在新会话中运行的 Claude Tag 例程：现在可以结束没有任何报告的运行，而无需向频道发布一次性消息"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "[Claude Tag] Changed Claude Tag admin settings to show a lock instead of # for private Slack channels that your own Slack account can see", "中文内容": "[Claude Tag] 更改了 Claude Tag 管理设置，以显示您自己的 Slack 帐户可以看到的私人 Slack 频道的锁而不是 #"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "[Code Review] Improved Code Review's check run to say no further automatic review will start when the model still can't analyze a change on the automatic retry", "中文内容": "[代码审查] 改进了代码审查的检查运行，表示当模型仍然无法分析自动重试时的更改时，不会启动进一步的自动审查"}, {"日期": "2026-10-26", "版本": "2.1.311", "类型": "改进", "内容": "[Code Review] Improved Code Review reliability: a review whose session fails to start because of a transient server fault is now retried once automatically, and its check run says so", "中文内容": "[代码审查] 改进了代码审查可靠性：由于暂时性服务器故障而导致会话无法启动的审查现在会自动重试一次，并且其检查运行如此"}];
