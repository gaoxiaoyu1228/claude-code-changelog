"修复", "内容": "Fixed NotebookEdit reporting success to hooks and telemetry when the edit failed, for example when the notebook changed while the permission prompt was open", "中文内容": "修复了编辑失败时 NotebookEdit 向挂钩和遥测报告成功的问题，例如，当权限提示打开时笔记本发生更改时"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a blank screen or no answer at startup, and empty `claude mcp list` output, when a stored MCP sign-in record was null", "中文内容": "修复了当存储的 MCP 登录记录为空时，启动时出现空白屏幕或无应答以及空`claude mcp list`输出的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed the Artifact tool telling Claude to add filters when an artifact's database collection is too large to sort; it now says to read the collection page by page and sort the results", "中文内容": "修复了 Artifact 工具，当工件的数据库集合太大而无法排序时，告诉 Claude 添加过滤器；现在它说逐页读取集合并对结果进行排序"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a restarted cloud session dropping a message with a large image when the restart came before Claude's first reply to it", "中文内容": "修复了在克劳德首次回复之前重新启动的云会话会丢弃带有大图像的消息的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed a restarted cloud session leaving a subagent's message to the main conversation unanswered", "中文内容": "修复了重新启动的云会话导致子代理发送给主对话的消息未得到答复的问题"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "修复", "内容": "Fixed Claude not being told when you stop or pause a running workflow, so it no longer says the workflow is still running", "中文内容": "修复了当您停止或暂停正在运行的工作流程时克劳德没有被告知的问题，因此它不再表示工作流程仍在运行"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the `/model` picker: \"More models\" is now an unnumbered row below every other, and older models open under it without renumbering the rest", "中文内容": "改进了`/model`选择器：“更多模型”现在是每行下方的未编号行，旧模型在其下打开，而无需重新编号其余模型"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Gateway: Improved spend limits on a busy replica, which now skips fewer checks and records spend sooner", "中文内容": "网关：改进了繁忙副本的支出限制，现在可以跳过更少的检查并更快地记录支出"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the Claude apps gateway's sign-in limit messages in Claude Code and on the `/device` page: they no longer name gateway settings, which the gateway's own log still names", "中文内容": "改进了克劳德代码和`/device`页面上克劳德应用程序网关的登录限制消息：它们不再命名网关设置，网关自己的日志仍然命名该设置"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved `claude install` and the install scripts: they finish 2 to 4 seconds sooner", "中文内容": "改进了`claude install`和安装脚本：它们更快完成 2 到 4 秒"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved how soon a Remote Control session whose process crashed can pick up a new message", "中文内容": "改进了进程崩溃的远程控制会话接收新消息的速度"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Improved startup and first-command time by finding programs on PATH without starting a helper process", "中文内容": "Windows：通过在 PATH 上查找程序而无需启动帮助程序进程，从而改进了启动和首次命令时间"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved auto mode in headless sessions, the desktop app and VS Code: reports from background subagents that wait together are answered in one model call, as in the terminal", "中文内容": "改进了无头会话、桌面应用程序和 VS Code 中的自动模式：来自一起等待的后台子代理的报告在一个模型调用中得到应答，就像在终端中一样"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the agent view's row for a `claude --bg --worktree` session that couldn't set up its worktree: it now shows the error from its beginning, not an internal tag or its last 200 characters", "中文内容": "改进了无法设置其工作树的`claude --bg --worktree`会话的代理视图行：它现在从头开始显示错误，而不是内部标记或其最后 200 个字符"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the messages shown when an artifact is in another organization: `/login` is offered only if it's one of yours, and Claude now says where a copy may be after an account move", "中文内容": "改进了当工件位于另一个组织中时显示的消息：仅当它是您的组织之一时才提供`/login`，并且克劳德现在会显示帐户移动后副本可能位于的位置"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved sessions with more images than fit in one request: Claude is told whether it has already seen a dropped image, and repeat reads of an unchanged image are limited", "中文内容": "改进了会话，图像数量超出了一次请求的容纳范围：Claude 被告知是否已经看到了已删除的图像，并且对未更改图像的重复读取受到限制"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved `claude remote-control`'s messages for an unanswered first-run question: each now says what to do next", "中文内容": "改进了“克劳德远程控制”针对未回答的首次运行问题的消息：现在每个消息都会说明下一步该做什么"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved start-up time by loading trusted TLS certificates faster", "中文内容": "通过更快地加载受信任的 TLS 证书来缩短启动时间"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved Claude apps gateway error messages to show the gateway's address without any user name or password", "中文内容": "改进了 Claude 应用程序网关错误消息，以显示网关地址，无需任何用户名或密码"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Improved the Claude apps gateway's spend limit error: the reset now shows in your local time, such as \"resets 4pm (America/Los_Angeles)\"", "中文内容": "改进了克劳德应用程序网关的支出限制错误：重置现在显示为您当地时间，例如“重置下午 4 点（美国/洛杉矶）”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Improved startup time with a standard Git for Windows install by no longer checking which git.exe to run on every launch", "中文内容": "Windows：通过不再检查每次启动时运行哪个 git.exe，使用适用于 Windows 安装的标准 Git 改进了启动时间"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Updated the session-feedback message and the `allowedProviders` setting description to name Ultra alongside Pro and Max, and the `forceLoginMethod` description to cover every paid Claude plan", "中文内容": "更新了会话反馈消息和`allowedProviders`设置描述，将 Ultra 与 Pro 和 Max 一起命名，并更新了`forceLoginMethod`描述以涵盖每个付费 Claude 计划"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Updated the bundled dataviz skill to suggest a list of meters, one row per item, for several ratios that each have their own limit", "中文内容": "更新了捆绑的数据可视化技能，以建议一个仪表列表，每个项目一行，针对多个比率，每个比率都有自己的限制"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Updated the \"Upgrade to Max\" options to say \"Upgrade to Max or Ultra\"", "中文内容": "将“升级到 Max”选项更新为“升级到 Max 或 Ultra”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed mods Claude writes to turn on without asking in auto and bypass modes, even with managed `allowUnsandboxedCommands: false` or `allowManagedDomainsOnly`, and not to load in `dontAsk` mode", "中文内容": "更改了 Claude 写入的模组，使其在自动和旁路模式下无需询问即可打开，即使使用托管`allowUnsandboxedCommands: false`或`allowManagedDomainsOnly`，也不会在`dontAsk`模式下加载"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed mods' own tool calls (`$.tool.call`, `$.mcp.call`) to raise no permission prompt, even under your own ask rules or in `dontAsk` and `-p` runs; deny rules and organization policy still apply", "中文内容": "更改了 mods 自己的工具调用（`$.tool.call`、`$.mcp.call`）以引发无权限提示，即使在您自己的询问规则下或在 `dontAsk` 和 `-p` 运行中也是如此；拒绝规则和组织政策仍然适用"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed saved Fable 5.1 model picks to move to `fable`: on Pro and Max plans at once, on Team and Enterprise plans once your organization allows it; use `/model claude-fable-5-1` to switch back", "中文内容": "更改了已保存的《神鬼寓言 5.1》模型选择，以移至“寓言”：立即使用 Pro 和 Max 计划，一旦您的组织允许，就使用 Team 和 Enterprise 计划；使用 `/model claude-`fable`-5-1` 切换回来"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the fast mode labels in `/fast`, `/config` and `/model` to name your current model when it supports fast mode, and removed \"(Opus only)\" from the VS Code row", "中文内容": "更改了 `/fast`、`/config` 和 `/model` 中的快速模式标签，以在支持快速模式时命名当前模型，并从 VS Code 行中删除“(仅限 Opus)”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed nested skill loading: `.claude/skills` folders inside `~/.claude/plugins` no longer load when Claude works on files there", "中文内容": "更改了嵌套技能加载：当克劳德处理其中的文件时，`~/.claude/plugins`内的`.claude/skills`文件夹不再加载"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Self-hosted runner: Changed an on-demand runner that the server refuses because it is not needed (session ended or paused, work order superseded) to exit 0 instead of 1", "中文内容": "自托管运行程序：更改了服务器拒绝的按需运行程序，因为不需要它（会话结束或暂停，工作订单被取代）以退出 0 而不是 1"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Windows: Changed how Claude Code finds programs it starts itself, such as git, to skip relative and UNC PATH entries and links onto a network share, and to pick up PATH changes from settings", "中文内容": "Windows：更改了 Claude Code 查找自身启动的程序（例如 git）的方式，以跳过相对路径和 UNC 路径条目以及网络共享的链接，并从设置中获取路径更改"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed OpenTelemetry hook events in non-interactive sessions to leave two built-in hooks out of `num_hooks` and `num_success` after Bash and PowerShell calls", "中文内容": "更改了非交互式会话中的 OpenTelemetry 挂钩事件，以在 Bash 和 PowerShell 调用后将两个内置挂钩保留在`num_hooks`和`num_success`之外"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the number of messages a Claude Desktop Code tab session can send to your other sessions before it waits for you to type again from 10 to 20", "中文内容": "将 Claude Desktop Code 选项卡会话在等待您再次键入之前可以发送到其他会话的消息数从 10 更改为 20"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed `AskUserQuestion` in `claude -p` and SDK sessions to deny a host's permission answer that sets the undocumented `afkTimeoutMs` input field", "中文内容": "更改了`claude -p`和 SDK 会话中的`AskUserQuestion`，以拒绝设置未记录的`afkTimeoutMs`输入字段的主机权限答案"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed managed `extraKnownMarketplaces`: a declared name can't be added from another source, an entry from elsewhere is hidden, and plugins the declared marketplace lists are reinstalled from it", "中文内容": "更改了托管`extraKnownMarketplaces`：无法从其他来源添加声明的名称，隐藏来自其他地方的条目，并且从其中重新安装声明的市场列表的插件"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed Claude in Chrome tools that an app running Claude Code provides, such as the Claude desktop app's Code tab, to follow your organization's Claude in Chrome policy", "中文内容": "更改了运行 Claude Code 的应用程序提供的 Claude in Chrome 工具（例如 Claude 桌面应用程序的“代码”选项卡），以遵循组织的 Claude in Chrome 政策"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed `policy_mode: layered` in the Claude apps gateway: managed MCP servers now add up over every matching policy, `match: {}` included, so a gateway already on it serves more after the upgrade", "中文内容": "更改了 Claude 应用程序网关中的“policy_mode：分层”：托管 MCP 服务器现在在每个匹配策略（包括`match: {}`）上进行累加，因此升级后其上已有的网关可以提供更多服务"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "Gateway: Changed Bedrock, Vertex and Foundry upstreams to ignore the `ANTHROPIC_*_BASE_URL` variables in the gateway's environment. Set `base_url` on the upstream to use another endpoint", "中文内容": "网关：更改了 Bedrock、Vertex 和 Foundry 上游，以忽略网关环境中的`ANTHROPIC_*_BASE_URL`变量。在上游设置 `base_url` 以使用另一个端点"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed headless sessions to reload mods in `.claude/skills` when their files change; set `CLAUDE_CODE_PLUGIN_DIR_WATCH=0` to turn this off", "中文内容": "更改了无头会话，以便在文件更改时重新加载`.claude/skills`中的模组；设置 `CLAUDE_CODE_PLUGIN_DIR_WATCH=0` 将其关闭"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the Cyber Verification Program sentence on a cyber safeguard block to use the same words as claude.ai", "中文内容": "更改了网络安全块上的网络验证计划句子，以使用与 claude.ai 相同的单词"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed Cowork cloud sessions: a PostToolUse hook can no longer replace the answer to AskUserQuestion or the plan in ExitPlanMode's result; Claude reads the originals", "中文内容": "更改了 Cowork 云会话：PostToolUse 挂钩无法再替换 AskUserQuestion 的答案或 ExitPlanMode 结果中的计划；克劳德读原著"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed `cp` and `mv` spelled by a path, such as `/bin/cp`, to get the same path checks as `cp` and `mv`", "中文内容": "更改了路径拼写的`cp`和`mv`，例如`/bin/cp`，以获得与`cp`和`mv`相同的路径检查"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed background command notifications and TaskStop results to show Claude only the start and end of a command over 1,000 characters, which saves context", "中文内容": "更改了后台命令通知和 TaskStop 结果，以仅向 Claude 显示超过 1,000 个字符的命令的开头和结尾，从而节省了上下文"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed artifact design guidance to treat Inter and Space Grotesk as good default typefaces", "中文内容": "更改了工件设计指南，将 Inter 和 Space Grotesk 视为良好的默认字体"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed the account email check to refuse only a shell command that holds your email and names a User-Agent, without asking, so other commands and scheduled runs no longer stop at its prompt", "中文内容": "更改了帐户电子邮件检查，仅拒绝保存您的电子邮件并命名用户代理的 shell 命令，无需询问，因此其他命令和计划运行不再在提示符处停止"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed Remote Control sessions to keep the folder they were started in: a connected client can no longer move a session to another folder", "中文内容": "更改了远程控制会话以保留它们启动的文件夹：连接的客户端无法再将会话移动到另一个文件夹"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "改进", "内容": "Changed managed `extraKnownMarketplaces` take-overs from an undeclared source: saved data is set aside for `cleanupPeriodDays`, and options and secrets until `claude plugin restore-set-aside`", "中文内容": "更改了未声明来源的托管`extraKnownMarketplaces`接管：保存的数据预留给`cleanupPeriodDays`，以及选项和秘密，直到“claude插件恢复设置预留”"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "[VSCode] Added a warning above the prompt box when both an auth token and an API key are set, matching the terminal's startup warning", "中文内容": "[VSCode] 在设置 auth token 和 API key 时在提示框上方添加警告，与终端的启动警告相匹配"}, {"日期": "2026-11-09", "版本": "2.1.321", "类型": "其他", "内容": "[VSCode] Fixed a plugin's permission request showing a name with hidden characters: it now reads \"a plugin\"", "中文内容": "[VSCode] 修复了插件的权限请求显示带有隐藏字符的名称：现在显示为“插件”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed auto mode with telemetry or feature flags off, including behind LLM gateways: calls the server can't check are asked about or denied, with no fallback to the built-in classifier; set `CLAUDE_CODE_AUTO_MODE_SERVER=0` to keep using it (Bedrock, Vertex and Foundry are unchanged)", "中文内容": "更改了遥测或功能标记关闭的自动模式，包括在 LLM 网关后面：服务器无法检查的呼叫会被询问或拒绝，不会回退到内置分类器；设置 `CLAUDE_CODE_AUTO_MODE_SERVER=0` 以继续使用它（Bedrock、Vertex 和 Foundry 不变）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed auto mode behind an LLM gateway: `CLAUDE_CODE_AUTO_MODE_SERVER=1` turns on the server-side check even with `CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS` set; if managed settings set the latter, they must set the `1` too", "中文内容": "更改了 LLM 网关后面的自动模式：即使设置了`CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS`，`CLAUDE_CODE_AUTO_MODE_SERVER=1`也会打开服务器端检查；如果托管设置设置了后者，则它们也必须设置`1`"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added support for MCP tasks in the terminal: when an MCP server runs a tool call as a task, Claude Code moves it to the background right away and tells Claude the result when it finishes", "中文内容": "添加了对终端中 MCP 任务的支持：当 MCP 服务器将工具调用作为任务运行时，Claude Code 会立即将其移动到后台，并在完成时告诉 Claude 结果"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added the `CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND` environment variable to make Claude Code wait for an MCP task inside its tool call instead of moving it to the background right away", "中文内容": "添加了`CLAUDE_CODE_DISABLE_MCP_TASK_BACKGROUND`环境变量，使 Claude Code 在其工具调用中等待 MCP 任务，而不是立即将其移动到后台"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `permissions.denyInsteadOfPrompting` setting: a tool call that would wait on a permission prompt is denied and the turn continues, in terminal sessions, subagents and teammates", "中文内容": "添加了`permissions.denyInsteadOfPrompting`设置：在终端会话、子代理和队友中，将等待权限提示的工具调用被拒绝，并且轮流继续"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `/claude-api latency-optimize` to find where your Claude API code makes people wait and try faster settings against your eval", "中文内容": "添加了 `/claude-api Latent-optimize` 来查找您的 Claude API 代码让人们等待的地方，并针对您的评估尝试更快的设置"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added the `CLAUDE_CODE_DISABLE_FEATURE_FLAGS` environment variable, which stops feature-flag fetching without turning off telemetry; every flag then uses its built-in default", "中文内容": "添加了`CLAUDE_CODE_DISABLE_FEATURE_FLAGS`环境变量，该变量可在不关闭遥测的情况下停止功能标志获取；然后每个标志都使用其内置默认值"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added spend for today, this week and this month to `/usage` for developers behind a Claude apps gateway who have no spend limit, when the gateway runs this version or later", "中文内容": "当网关运行此版本或更高版本时，为没有支出限制的 Claude 应用程序网关背后的开发人员添加了今天、本周和本月的支出到`/usage`"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `admin.pooled_conflict_rule` and `admin.pooled_priority_order` to the Claude apps gateway, to set which pooled group budget pays first for a developer in several groups", "中文内容": "在 Claude 应用程序网关中添加了`admin.pooled_conflict_rule`和`admin.pooled_priority_order`，以设置哪个集合组预算首先为多个组中的开发人员支付"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added an optional `login_notice` setting to the Claude apps gateway that shows an operator-defined message on the gateway's browser verification page and on Claude Code's sign-in screen", "中文内容": "向 Claude 应用程序网关添加了可选的`login_notice`设置，该设置在网关的浏览器验证页面和 Claude Code 的登录屏幕上显示运营商定义的消息"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added `CLAUDE_GATEWAY_LOG_FORMAT=json` to the Claude apps gateway: operational log lines become JSON with `severity`, `time` and `message`, for log collectors that read the level from a field", "中文内容": "在 Claude 应用程序网关中添加了`CLAUDE_GATEWAY_LOG_FORMAT=json`：对于从字段读取级别的日志收集器，操作日志行变为带有“严重性”、“时间”和“消息”的 JSON"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a Claude apps gateway boot warning for a case where another policy's `availableModels` also allows a custom model id that one policy lists by name", "中文内容": "添加了克劳德应用程序网关启动警告，针对另一种策略的`availableModels`也允许一个策略按名称列出的自定义模型 ID 的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added start-up warnings to the Claude apps gateway for policies with no `desktopHome` that rely on `coworkTabEnabled: false` or `chatSessionRetentionDays`, ahead of Claude Desktop's November 10 change", "中文内容": "在 Claude Desktop 于 11 月 10 日进行更改之前，向 Claude 应用程序网关添加了启动警告，以针对没有依赖于`coworkTabEnabled: false`或`chatSessionRetentionDays`的`desktopHome`的策略"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a warning when your claude.ai login ends and Claude Code continues on the sign-in from `ant auth login`, which bills usage to your Claude Console organization", "中文内容": "添加了当您的 claude.ai 登录结束并且 Claude Code 继续从`ant auth login`登录时添加的警告，这会向您的 Claude Console 组织收取使用费用"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a line at startup naming the Claude Console organization that is billed in a case where Claude Code uses the sign-in from `ant auth login`", "中文内容": "在启动时添加了一行，命名 Claude Console 组织，该组织在 Claude Code 使用`ant auth login`登录的情况下计费"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added an \"Earlier in this session\" row to `/tasks` that lists finished subagents, so you can reopen one and message it even after it leaves the list or you restart", "中文内容": "在`/tasks`中添加了“本次会话中的较早”行，其中列出了已完成的子代理，因此即使在它离开列表或重新启动后，您也可以重新打开一个子代理并向其发送消息"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Added a note to `/loop` confirmations in cloud sessions that a timer stops with its container, with an offer of a loop that survives", "中文内容": "在云会话中的`/loop`确认中添加了一条注释，即计时器随其容器停止，并提供了一个存活的循环"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed MCP servers on the older handshake failing to connect, or returning empty results, because Claude Code declared an extension that it only uses with newer servers", "中文内容": "修复了旧握手上的 MCP 服务器无法连接或返回空结果的问题，因为 Claude Code 声明了一个仅与较新服务器一起使用的扩展"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a long-running MCP tool call on a claude.ai connector sometimes never reporting its result after `--resume`", "中文内容": "修复了 claude.ai 连接器上长时间运行的 MCP 工具调用有时在`--resume`之后从不报告其结果的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a session's diff failing to load on claude.ai and the mobile apps when the folder Claude Code runs in has a file or folder named `HEAD`", "中文内容": "修复了当 Claude Code 运行的文件夹包含名为`HEAD`的文件或文件夹时，会话的差异无法在 claude.ai 和移动应用程序上加载的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/diff` showing \"Diff unavailable\" when a git repository has a file or folder named `HEAD` at its top level", "中文内容": "修复了当 git 存储库在其顶层有名为`HEAD`的文件或文件夹时`/diff`显示“Diff unavailable”的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the `/diff` pane opening blank in sessions where 64 or more turns edited files", "中文内容": "修复了在 64 个或更多轮次编辑文件的会话中打开空白的`/diff`窗格"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed slash commands typed after a leading space, tab or newline being sent to Claude as plain text instead of running", "中文内容": "修复了在前导空格、制表符或换行符之后键入的斜杠命令以纯文本形式发送给 Claude，而不是运行"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a request that kept failing with a 401 refreshing your login on every retry and causing 401s in your other sessions", "中文内容": "修复了每次重试时始终失败并出现 401 刷新登录信息并导致其他会话出现 401 错误的请求"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/context` sending its full visual grid to Claude on every later turn; Claude now reads only the table", "中文内容": "修复了`/context`在以后的每个回合中将其完整的视觉网格发送给克劳德的问题；克劳德现在只读取表格"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude -p` exiting 0 in auto mode when its actions were refused because no safety check was available: text and JSON output now exit 1", "中文内容": "修复了`claude -p`在自动模式下退出 0 的问题，因为没有可用的安全检查，其操作被拒绝：文本和 JSON 输出现在退出 1"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where Claude Code listed every project file at start on Linux for projects on a network file system (NFS, SMB, Lustre and similar)", "中文内容": "修复了 Claude Code 在 Linux 上启动时列出网络文件系统（NFS、SMB、Lustre 等）项目的每个项目文件的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where auto mode was wrongly refused when a client sent a model change and a request for auto mode back to back", "中文内容": "修复了客户端连续发送模型更改和自动模式请求时错误拒绝自动模式的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/status` showing \"Auto mode server: Enabled\" when the server-side review isn't reaching the session, for example behind an LLM gateway that drops it", "中文内容": "修复了当服务器端审核未到达会话时显示“自动模式服务器：已启用”的`/status`，例如在将其丢弃的 LLM 网关后面"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Claude-drafted feedback, surveys and `/feedback` continuing to appear after the server refused feedback for your organization", "中文内容": "修复了服务器拒绝为您的组织提供反馈后，克劳德起草的反馈、调查和“/反馈”继续出现的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Claude drafting feedback on third-party gateways, where it can't be sent", "中文内容": "修复了克劳德在第三方网关上起草反馈无法发送的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed auto mode refusing actions without saying why when permission rules or `autoMode` settings are very large: it now explains and, unless `autoMode` deny rules are set, asks you in the terminal", "中文内容": "修复了当权限规则或`autoMode`设置非常大时自动模式拒绝操作而不说明原因的问题：现在它会进行解释，除非设置了`autoMode`拒绝规则，否则会在终端中询问您"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where Bash deny and ask rules missed commands written with quoted words", "中文内容": "修复了 Bash 拒绝和询问规则错过用引号括起来的命令的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed subagent hand-back reports showing an internal marker and provenance note when expanded outside verbose mode", "中文内容": "修复了在详细模式之外扩展时显示内部标记和出处注释的子代理返还报告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude -p --resume` with a prompt losing a deferred tool call when its MCP server is missing: the run now exits 1, keeps the call and refuses later input", "中文内容": "修复了`claude -p --resume`，当其 MCP 服务器丢失时提示丢失延迟的工具调用：运行现在退出 1，保留调用并拒绝稍后的输入"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where text was dropped from informational messages sent to SDK clients", "中文内容": "修复了发送到 SDK 客户端的信息消息中文本被删除的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where Agent SDK hosts got a generic exit-code error instead of a failed run's own error message when the disk was full", "中文内容": "修复了磁盘已满时 Agent SDK 主机收到通用退出代码错误而不是运行失败自己的错误消息的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `CLAUDE_CODE_RESUME_INTERRUPTED_TURN` re-running a turn that was interrupted in plan mode when the session resumes in another permission mode", "中文内容": "修复了当会话在另一种权限模式下恢复时`CLAUDE_CODE_RESUME_INTERRUPTED_TURN`重新运行在计划模式下中断的回合"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed edits to a settings file being ignored when made within a few seconds of Claude Code writing that file", "中文内容": "修复了在克劳德代码写入该文件的几秒钟内对设置文件进行的编辑被忽略的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a config file left at the legacy name hiding your setup with no warning: Claude Code now says on stderr when a home holds two config files, and which is in use", "中文内容": "修复了保留在旧名称中的配置文件隐藏您的设置且没有任何警告：克劳德代码现在在标准错误上显示当一个家庭拥有两个配置文件并且正在使用中时"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `~/.claude.json`, settings and edited files ending up empty or cut off when the disk fills during a save in a read-only folder or to a bind-mounted file (one session saving at a time)", "中文内容": "修复了`~/.claude.json`、设置和编辑的文件在保存到只读文件夹或绑定安装文件期间磁盘已满时最终为空或被切断的问题（一次保存一个会话）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Write ending the turn as a refusal when it couldn't read the file to overwrite", "中文内容": "修复了写入在无法读取要覆盖的文件时以拒绝结束回合的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed background Bash commands that finish almost instantly losing their output while being reported as completed", "中文内容": "修复了后台 Bash 命令在报告为已完成时几乎立即丢失其输出的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the Bash tool's diff of changed files missing a file that the command wrote just before it ended", "中文内容": "修复了 Bash 工具的已更改文件的差异，缺少该命令在结束之前写入的文件"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a mistyped model name, such as `opus-5-5`, telling you to update Claude Code instead of suggesting the model you meant", "中文内容": "修复了错误输入的模型名称，例如`opus-5-5`，告诉您更新 Claude Code，而不是建议您想要的模型"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where `NotebookEdit` changed the wrong cell when the notebook changed while a permission prompt was open", "中文内容": "修复了打开权限提示时笔记本更改时`NotebookEdit`更改错误单元格的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a ~0.5s hang after pressing Enter on the `/login` success screen: the dialog now dismisses immediately and the post-login refresh runs in the background", "中文内容": "修复了在`/login`成功屏幕上按 Enter 后大约 0.5 秒的挂起：对话框现在立即关闭，登录后刷新在后台运行"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Ctrl+G not opening the external editor while typing an \"Other\" answer to a question in screen reader mode", "中文内容": "修复了在屏幕阅读器模式下键入问题的“其他”答案时 Ctrl+G 未打开外部编辑器的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Monitor's WebSocket watch failing with \"could not resolve\" behind a proxy when `CLAUDE_CODE_PROXY_RESOLVES_HOSTS` is set and the machine has no DNS of its own", "中文内容": "修复了当设置了`CLAUDE_CODE_PROXY_RESOLVES_HOSTS`并且计算机没有自己的 DNS 时，监视器的 WebSocket 监视失败，并在代理后面显示“无法解析”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude plugin eval` warnings suggesting `max: 0` for a tool that must not be called, which could never pass", "中文内容": "修复了`claude plugin eval`警告，建议不得调用工具的`max: 0`，该工具永远无法通过"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed background plugin auto-update not installing a dependency added by the updated plugin version", "中文内容": "修复了后台插件自动更新未安装更新的插件版本添加的依赖项的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Cmd+click not opening links in Ghostty over tmux in sessions opened from the agents view", "中文内容": "修复了在从代理视图打开的会话中 Cmd+click 无法通过 tmux 打开 Ghostty 中的链接的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a mod's hot reload in `.claude/skills` missing a file that was deleted just after it appeared, and missing its return", "中文内容": "修复了`.claude/skills`中 mod 的热重载缺少一个在出现后立即被删除的文件，并且缺少其返回的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/rewind` failing with \"No files were restored\" when restoring code to a checkpoint from before `/branch`", "中文内容": "修复了将代码从`/branch`之前恢复到检查点时`/rewind`失败并显示“未恢复文件”的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the `/claude-api` skill saying Console web settings don't apply to Managed Agents sessions, and tightened its credential and permission examples", "中文内容": "修复了`/claude-api`技能说控制台 Web 设置不适用于托管代理会话，并收紧了其凭据和权限示例"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed needless permission prompts for read-only commands wrapped in a plain `timeout DURATION`, such as `timeout 30 rg foo`", "中文内容": "修复了包装在普通`timeout DURATION`中的只读命令的不必要的权限提示，例如`timeout 30 rg foo`"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed WebFetch describing claude.ai shared-chat links as empty pages; it now says shared chats can't be read and to paste the conversation instead", "中文内容": "修复了 WebFetch 将 claude.ai 共享聊天链接描述为空页面的问题；现在它说无法读取共享聊天并粘贴对话"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Artifact database calls being re-sent to artifacts without a database; errors now say whether republishing helps", "中文内容": "修复了工件数据库调用被重新发送到没有数据库的工件的问题；现在错误表明重新发布是否有帮助"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where artifact database reads that save to a folder (`out_dir`) were refused", "中文内容": "修复了保存到文件夹（`out_dir`）的工件数据库读取被拒绝的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed detailed beta tracing not presenting `CLAUDE_CODE_CLIENT_CERT` to collectors that require a client certificate", "中文内容": "修复了详细的测试版跟踪不向需要客户端证书的收集器提供`CLAUDE_CODE_CLIENT_CERT`的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the OpenTelemetry `claude_code.session.count` metric counting Agent SDK `prewarm()` processes that were never claimed; a pre-started process now counts once, when it is claimed", "中文内容": "修复了从未声明的 OpenTelemetry `claude_code.session.count` 指标计数 Agent SDK `prewarm()` 进程；预先启动的进程现在在声明时计算一次"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/clear` killing running commands of background agents, teammates and workflows that keep running, and foreground subagents of background agents and teammates", "中文内容": "修复了`/clear`杀死后台代理、队友和持续运行的工作流程以及后台代理和队友的前台子代理的运行命令"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a terminal whose Claude apps gateway sign-in had expired sending telemetry and managed-settings requests that the gateway refused and logged as `invalid_token`", "中文内容": "修复了克劳德应用程序网关登录已过期的终端，发送网关拒绝并记录为`invalid_token`的遥测和托管设置请求"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the agents view appearing to send a reply to a background session waiting on a permission prompt; the reply now stays in the box with a hint to open the session and answer", "中文内容": "修复了代理视图似乎向等待权限提示的后台会话发送回复的问题；回复现在保留在框中，并提示打开会话并回答"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed agent view removing a draft saved by another agent view in the same directory when exiting", "中文内容": "修复了退出时代理视图删除同一目录中另一个代理视图保存的草稿的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where agent view came back with another agent view's input text after restarting itself for an update", "中文内容": "修复了代理视图在重新启动更新后返回另一个代理视图的输入文本的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the agents view preview cutting off long commands, results and status lines without an ellipsis, and dropping `**`, backticks and tags from commands waiting for approval", "中文内容": "修复了代理视图预览在没有省略号的情况下截断长命令、结果和状态行，并从等待批准的命令中删除`**`、反引号和标签"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Claude in Chrome reporting the extension as not connected when the connection dropped mid-action; Claude now checks the page before repeating an action that may have run", "中文内容": "修复了 Chrome 中的 Claude 在操作过程中连接断开时报告扩展程序未连接的问题；克劳德现在在重复可能已运行的操作之前检查页面"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed Remote Control sessions still showing \"Limit reached\" on other devices after a usage limit was lifted outside the session", "中文内容": "修复了在会话外解除使用限制后，远程控制会话在其他设备上仍显示“已达到限制”的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed the file card sometimes missing in the Claude iOS app when Claude sent a single file", "中文内容": "修复了克劳德发送单个文件时，克劳德 iOS 应用程序有时会丢失文件卡的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed self-hosted runner sessions failing with no explanation when the server keeps refusing to renew model access: the runner now retries sooner and posts a warning in the session", "中文内容": "修复了当服务器不断拒绝更新模型访问权限时，自托管运行器会话失败且没有任何解释的问题：运行器现在会更快地重试并在会话中发布警告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/permissions` in cloud sessions replying only that it isn't available; it now says where the session's rules live and how to change them", "中文内容": "修复了云会话中的`/permissions`仅回复不可用的问题；现在它会说明会话规则的位置以及如何更改它们"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed cloud sessions losing session-scoped deny and ask permission rules, such as those a PermissionRequest hook adds, when the session moves to a new worker", "中文内容": "修复了当会话移动到新工作人员时，云会话丢失会话范围的拒绝和询问权限规则，例如 PermissionRequest 挂钩添加的规则"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed mod hot-reloading turning off for the session when you typed three messages instead of answering its question in a cloud session", "中文内容": "修复了当您键入三条消息而不是在云会话中回答其问题时，会话的 mod 热重载关闭"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed background tasks that keep running after `/clear` disappearing from the task list in Claude Code on the web until another task started or ended", "中文内容": "修复了`/clear`从网络上 Claude Code 的任务列表中消失后继续运行的后台任务，直到另一个任务开始或结束为止"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed hidden commands appearing in the slash command menu of cloud sessions on mobile and web", "中文内容": "修复了移动和 Web 上云会话的斜线命令菜单中出现的隐藏命令"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where `/rewind` could restore or delete a file through a directory symlink", "中文内容": "修复了`/rewind`可以通过目录符号链接恢复或删除文件的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where a `sed` command could skip the permission check in accept-edits and auto mode", "中文内容": "修复了`sed`命令可以在接受编辑和自动模式下跳过权限检查的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where `CLAUDE_CODE_AUTO_MODE_SERVER=1` in managed settings was ignored behind an LLM gateway when the gateway's URL is set only there and server-managed settings can't be fetched", "中文内容": "修复了当仅在此处设置网关的 URL 并且无法提取服务器管理的设置时，托管设置中的`CLAUDE_CODE_AUTO_MODE_SERVER=1`在 LLM 网关后面被忽略的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a Bash permission bypass where a crafted environment prefix could hide part of a command from permission checks", "中文内容": "修复了 Bash 权限绕过问题，其中精心设计的环境前缀可能会隐藏部分命令以防止权限检查"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where deny and ask rules, hook matchers and `disallowedTools` entries written with a claude.ai connector's terminal name (`mcp__claude_ai_Slack`) were ignored in Claude Desktop (takes effect once Claude Desktop includes this version)", "中文内容": "修复了在 Claude Desktop 中忽略拒绝和询问规则、挂钩匹配器和使用 claude.ai 连接器的终端名称 (`mcp__claude_ai_Slack`) 编写的 `disallowedTools` 条目的情况（Claude Desktop 包含此版本后生效）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a sandbox escape when creating a worktree", "中文内容": "修复了创建工作树时的沙箱逃逸问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed self-hosted runners: `--trust-workspace false` now also stops hooks in the repository's settings files and skills from running", "中文内容": "修复了自托管运行程序：`--trust-workspace false`现在还会阻止存储库设置文件和技能中的挂钩运行"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where idle background sessions started through a shell-exported LLM gateway left the gateway after an update", "中文内容": "修复了更新后通过 shell 导出的 LLM 网关启动的空闲后台会话离开网关的情况"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed help links in `/status` and the auto mode billing notice opening only part of the address when they wrap", "中文内容": "修复了`/status`中的帮助链接和自动模式计费通知在换行时仅打开部分地址的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where certificate errors behind a TLS-inspecting proxy persisted when `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` was set. With it set, Claude Code now makes a TLS handshake with the configured API host after a certificate failure, through your http:// proxy if one is set; it sends no API request", "中文内容": "修复了设置`CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC`时，TLS 检查代理后面的证书错误仍然存在的情况。设置完成后，Claude Code 现在会在证书失败后通过您的 http:// 代理（如果已设置）与配置的 API 主机进行 TLS 握手；它不发送 API 请求"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude remote-control` exiting silently with status 0 when a first-run question gets no answer (scripts, services, batch jobs, Ctrl+C); it now says why and exits 1", "中文内容": "修复了当首次运行的问题没有得到答案时“claude Remote-control”以状态 0 静默退出的问题（脚本、服务、批处理作业、Ctrl+C）；现在它会说明原因并退出 1"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude remote-control` ignoring a piped `y` that has no newline after it at the first-run question; it now counts as a yes", "中文内容": "修复了“claude Remote-control”在首次运行问题时忽略管道`y`后没有换行符的问题；现在算作“是”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `/rename` reporting plain success when the new name could not be saved to the session transcript; it now warns that the new name may not last", "中文内容": "修复了当新名称无法保存到会话记录中时`/rename`报告简单成功的问题；现在警告新名称可能不会持续"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `${CLAUDE_PLUGIN_ROOT}` not being substituted in a plugin-provided `subagentStatusLine` command, which can now reference the plugin's own scripts", "中文内容": "修复了`${CLAUDE_PLUGIN_ROOT}`在插件提供的`subagentStatusLine`命令中未被替换的问题，该命令现在可以引用插件自己的脚本"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed `claude plugin update` and `/plugin` \"Update now\" not installing dependencies added by the new plugin version", "中文内容": "修复了`claude插件更新`和`/plugin`“立即更新”不安装新插件版本添加的依赖项的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed subagents being told after compaction to expect a completion notice for background agents they neither started nor took over", "中文内容": "修复了子代理在压缩后被告知等待后台代理完成通知的问题，他们既没有启动也没有接管"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Fixed a case where a background agent's later report was lost silently: the notification now says it was refused and how to ask for it", "中文内容": "修复了后台特工后来的报告默默丢失的情况：通知现在显示被拒绝以及如何索取"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved config saves on Windows: Claude Code waits longer for a file another program has open, so a kill during a save is less likely to leave `~/.claude.json` empty", "中文内容": "改进了 Windows 上的配置保存：Claude Code 等待另一个程序打开的文件的时间更长，因此保存期间的终止不太可能使 `~/.claude.json` 为空"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved Claude in Chrome after a brief disconnect: it waits up to 6 seconds for the session's own browser to return before picking another", "中文内容": "改进了 Chrome 中短暂断开连接后的 Claude：在选择另一个浏览器之前，它会等待最多 6 秒让会话自己的浏览器返回"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved Claude in Chrome: `javascript_tool` results of up to 60,000 characters now stay in the conversation instead of being saved to a file", "中文内容": "改进了 Chrome 中的 Claude：最多 60,000 个字符的`javascript_tool`结果现在保留在对话中，而不是保存到文件中"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved `claude purge` and the clean-up of old sessions to retry a folder that could not be fully deleted, and to report it as an error if it remains", "中文内容": "改进了`claude purge`和旧会话的清理，以重试无法完全删除的文件夹，并将其报告为错误（如果仍然存在）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the refusal for a path outside the working directories on macOS and Windows: when only its letter case differs from a path inside them, the message names that spelling", "中文内容": "改进了对 macOS 和 Windows 上工作目录之外的路径的拒绝：当仅其字母大小写与其中的路径不同时，消息名称的拼写"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the contrast of faint gray secondary text, such as hints, details in `/stats`, `/model` and `/sandbox`, and rejected-action messages", "中文内容": "改进了淡灰色辅助文本的对比度，例如提示、`/stats`、`/model`和`/sandbox`中的详细信息以及拒绝操作消息"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the artifact database error when an update targets a document that does not exist, and when the service pauses repeated refused writes", "中文内容": "改进了更新目标不存在的文档以及服务暂停重复拒绝写入时的工件数据库错误"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the Claude apps gateway's warnings about a failed upstream call: each now names the upstream, not only its provider", "中文内容": "改进了克劳德应用程序网关有关上游调用失败的警告：每个现在都命名上游，而不仅仅是其提供商"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the Claude apps gateway's spend limit error: it reads \"spend limit reached · resets Dec 1\", then `admin.blocked_message` if one is set", "中文内容": "改进了克劳德应用程序网关的支出限制错误：它显示“已达到支出限制·重置 12 月 1 日”，然后是`admin.blocked_message`（如果设置了）"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved the `/model` picker: older models are now grouped under a \"More models\" row instead of being listed after the current ones", "中文内容": "改进了`/model`选择器：旧模型现在分组在“更多模型”行下，而不是列在当前模型之后"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved `/context` at the terminal so the table Claude reads stays short: each list keeps its 10 largest rows, and MCP tools that load on demand share one row per server until they're called", "中文内容": "改进了终端上的`/context`，因此克劳德读取的表保持简短：每个列表保留其最大的 10 行，按需加载的 MCP 工具在每个服务器上共享一行，直到它们被调用"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Improved `/usage` in cloud sessions: it now links to Settings → Usage on claude.ai in a case where plan limits can't be shown", "中文内容": "改进了云会话中的`/usage`：现在，在无法显示计划限制的情况下，它会链接到 claude.ai 上的“设置”→“使用情况”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[VSCode] Improved the confirmation for removing a plugin marketplace: it now checks which of its plugins are installed at that moment", "中文内容": "[VSCode] 改进了删除插件市场的确认：现在它会检查当时安装了哪些插件"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed MCP tasks to work in the terminal without feature-flag fetching (Bedrock, Vertex, Foundry, LLM gateways, `DISABLE_TELEMETRY`); set `CLAUDE_CODE_DISABLE_MCP_TASKS=1` to turn them off", "中文内容": "将 MCP 任务更改为在终端中工作，无需获取功能标志（Bedrock、Vertex、Foundry、LLM 网关、`DISABLE_TELEMETRY`）；设置 `CLAUDE_CODE_DISABLE_MCP_TASKS=1` 将其关闭"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed auto mode so that a project's settings files or a plugin can no longer switch its server-side check back on once you have switched it off outside the project", "中文内容": "更改了自动模式，以便项目的设置文件或插件在您在项目外部关闭后无法再重新打开其服务器端检查"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed Monitor's WebSocket watch to follow a rule on every Bash command: a deny refuses it, and under an ask rule an allow on Monitor, bypass mode or auto mode no longer skips the prompt", "中文内容": "更改了 Monitor 的 WebSocket 监视以遵循每个 Bash 命令的规则：拒绝拒绝它，并且在询问规则下允许 Monitor、旁路模式或自动模式不再跳过提示"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed `CLAUDE_CODE_PROXY_RESOLVES_HOSTS` so that settings files can no longer set it where the host manages the network; set it in the process environment", "中文内容": "更改了`CLAUDE_CODE_PROXY_RESOLVES_HOSTS`，以便设置文件不能再在主机管理网络的地方设置它；在进程环境中设置"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed a session's exact Bash or PowerShell ask rule to be refused, not asked about, when a broader deny rule covers the command", "中文内容": "当更广泛的拒绝规则涵盖命令时，更改了会话的确切 Bash 或 PowerShell 询问规则被拒绝，而不是询问"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed the Bash tool to ask for permission before running `which` with flags outside a lookup/display set", "中文内容": "更改了 Bash 工具，在使用查找/显示集之外的标志运行`which`之前请求许可"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed `--add-dir` directories to register plugin marketplaces only once that directory's own trust dialog has been accepted", "中文内容": "仅在接受该目录自己的信任对话框后，更改`--add-dir`目录以注册插件市场"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed nested skill loading: with the Bash sandbox on, skills in `.claude/skills` folders below the starting folder load only if you start Claude Code there or `/cd` there", "中文内容": "更改了嵌套技能加载：在打开 Bash 沙箱的情况下，仅当您启动 Claude Code 或启动`/cd`时，才会加载起始文件夹下`.claude/skills`文件夹中的技能"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed self-paced `/loop` to end when a turn finishes without rescheduling, instead of scheduling a fallback wakeup; set `CLAUDE_CODE_LOOP_KEEPALIVE=1` to keep the old behavior", "中文内容": "将自定进度的`/loop`更改为在回合结束时结束而不重新安排，而不是安排后备唤醒；设置`CLAUDE_CODE_LOOP_KEEPALIVE=1`以保留旧行为"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed PostToolUse hooks to run, with up to 10 seconds to finish, on tool calls that finish after a new message interrupts the turn", "中文内容": "更改了 PostToolUse 挂钩，以在新消息中断轮流后完成的工具调用上运行，最长需要 10 秒才能完成"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed what Claude is told after safeguards stop a subagent: retry with a narrower prompt or tell you, instead of doing the work itself", "中文内容": "更改了防护措施停止子代理后克劳德被告知的内容：用更窄的提示重试或告诉您，而不是自行完成工作"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed cloud sessions to drop session-scoped allow rules at a move to a new worker when their deny and ask rules can't all be kept, so you may be asked again", "中文内容": "更改了云会话，当拒绝和询问规则无法全部保留时，在移动到新工作人员时删除会话范围的允许规则，因此可能会再次询问您"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed the automatic certificate repair behind a TLS-inspecting proxy: it no longer runs when `ALL_PROXY` is the only proxy variable set. Set `HTTPS_PROXY` to the proxy's http:// URL instead", "中文内容": "更改了 TLS 检查代理后面的自动证书修复：当`ALL_PROXY`是唯一的代理变量集时，它不再运行。将 `HTTPS_PROXY` 设置为代理的 http:// URL"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Changed artifact database saves of rows others may have written: each file gets a hidden marker file, and existing files without one, earlier versions' exports among them, are left alone and reported", "中文内容": "更改的工件数据库保存其他人可能已写入的行：每个文件都会获得一个隐藏的标记文件，而没有标记文件的现有文件（其中早期版本的导出）将被单独保留并报告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Updated `/claude-api managed-agents-onboard` templates to match the Claude Console: removed Performance tuner, renamed two, and turned off web search and fetch in five whose prompts don't use them", "中文内容": "更新了“/claude-api Managed-agents-onboard”模板以匹配 Claude Console：删除了性能调优器，重命名为两个，并关闭了 5 个提示不使用它们的网络搜索和获取"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "移除", "内容": "Removed `shortcuts_list` and `shortcuts_execute`, which listed and started shortcuts saved in the extension, from Claude Code's built-in Claude in Chrome tools", "中文内容": "从 Claude Code 的 Chrome 内置 Claude 工具中删除了 `shortcuts_list` 和 `shortcuts_execute`，它们列出并启动了扩展程序中保存的快捷方式"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Gateway: Added startup warnings for upstreams that mix AWS GovCloud with other upstreams, and for base URL variables in the gateway's environment", "中文内容": "网关：添加了针对将 AWS GovCloud 与其他上游混合的上游以及网关环境中的基本 URL 变量的启动警告"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "Gateway: Added a start-up log warning when managed settings name an Amazon Bedrock guardrail in a header, which the gateway doesn't forward, and no `bedrock` upstream sets a `guardrail`", "中文内容": "网关：当托管设置在标头中命名 Amazon Bedrock 护栏时添加了启动日志警告，网关不会转发该护栏，并且没有`bedrock`上游设置“护栏”"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Gateway: Fixed Claude Desktop offering a web search tool that always failed when every upstream is Amazon Bedrock", "中文内容": "Gateway：修复了 Claude Desktop 提供的 Web 搜索工具在每个上游都是 Amazon Bedrock 时总是失败的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "Self-hosted runner: Fixed a runner started with `--use-anthropic-git-proxy` or `--configure-git` registering before a failed startup check made it exit; it now exits first", "中文内容": "自托管运行器：修复了在启动检查失败导致退出之前以`--use-anthropic-git-proxy`或`--configure-git`注册启动的运行器；现在它先退出"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "Self-hosted runner: Changed `CLAUDE_RUNNER_CHECKOUT_PATH` so that each repository in a session gets its own folder: a folder name already taken in the session gets `-2`, `-3`, … at the end", "中文内容": "自托管运行器：更改了`CLAUDE_RUNNER_CHECKOUT_PATH`，以便会话中的每个存储库都有自己的文件夹：会话中已采用的文件夹名称在末尾获取`-2`、`-3`等"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "移除", "内容": "Self-hosted runner: Removed the end-of-session upload of a session's debug log; a failed session's log stays on the runner host unless `--remove-session-state` is set", "中文内容": "自托管运行器：删除了会话调试日志的会话结束上传；除非设置了`--remove-session-state`，否则失败的会话日志将保留在运行器主机上"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed prompts over 50,000 characters being cut off silently: the prompt now stays in the chat box with a notice, and a paste over the limit is refused with a notice", "中文内容": "[VSCode] 修复超过 50,000 个字符的提示被静默截断的问题：提示现在保留在聊天框中并带有通知，超过限制的粘贴将被拒绝并带有通知"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed a click on the survey or \"Report a problem\" buttons sending the unfinished prompt", "中文内容": "[VSCode] 修复了点击调查或“报告问题”按钮发送未完成提示的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed cloud sessions opened from the extension's Web tab bringing back turns that `/clear`, or Retry or Edit of a typed prompt, had removed", "中文内容": "[VSCode] 修复了从扩展程序的 Web 选项卡打开的云会话，带回`/clear`或重试或编辑键入的提示已删除的轮次"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed a deleted session's file coming back when that session was renamed in the extension", "中文内容": "[VSCode] 修复了在扩展中重命名会话时删除的会话文件会返回的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed Claude carrying out an unapproved plan after a window reload: a step interrupted in plan mode now stops with a notice when the session comes back in another permission mode", "中文内容": "[VSCode] 修复了克劳德在窗口重新加载后执行未经批准的计划的问题：计划模式下中断的步骤现在会在会话以另一种权限模式返回时停止并发出通知"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[VSCode] Improved the \"not signed in\" message behind a Claude apps gateway: it now looks like an error and has a Sign in link", "中文内容": "[VSCode] 改进了 Claude 应用程序网关后面的“未登录”消息：它现在看起来像一个错误，并且有一个登录链接"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[VSCode] Changed links in Claude's replies that point at Claude sign-in, connector or API addresses to show as text with the address, instead of opening in the browser", "中文内容": "[VSCode] 更改了 Claude 回复中指向 Claude 登录、连接器或 API 地址的链接，以显示为带有地址的文本，而不是在浏览器中打开"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed a possible chat panel freeze when a dropped item's path contains a very long run of \"/\" characters", "中文内容": "[VSCode] 修复了当放置的项目的路径包含很长的“/”字符时聊天面板可能冻结的问题"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed the `claude-vscode.toggleDictation` command starting dictation in every open Claude view at once; it now acts only in the view you are using, and a second press stops it", "中文内容": "[VSCode] 修复了`claude-vscode.toggleDictation`命令在每个打开的 Claude 视图中立即开始听写的问题；现在它仅在您正在使用的视图中起作用，第二次按下将停止它"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[VSCode] Fixed the chat panel slowing down while a reply with many unclosed `$$` math fences, each shorter than the last, streams in", "中文内容": "[VSCode] 修复了聊天面板速度减慢的问题，而带有许多未封闭的`$$`数学栅栏的回复（每个栅栏都比上一个短）在流中流动"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[VSCode] Improved the chat panel's diagnostics tool for large workspaces: it leaves out files with no problems, returns compact JSON, and accepts an optional minimum severity", "中文内容": "[VSCode] 改进了适用于大型工作区的聊天面板的诊断工具：它不会出现任何问题，返回紧凑的 JSON，并接受可选的最低严重性"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[Cloud sessions] Fixed scheduled tasks silently dropping a connector named memory: runs now keep it, mounted under that name plus a short suffix", "中文内容": "[云会话] 修复了计划任务静默删除名为内存的连接器的问题：现在运行时保留它，安装在该名称加上一个短后缀下"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[Cloud sessions] Fixed Send now on a waiting message in cloud sessions ending running background agents; they now keep running", "中文内容": "[云会话]修复了在结束运行后台代理的云会话中立即发送等待消息的问题；他们现在继续奔跑"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[Cloud sessions] Improved the stalled-setup warning on self-hosted environments: its link now prefers your organization's default or an environment with a live runner, and names it", "中文内容": "[云会话] 改进了自托管环境中的停顿设置警告：其链接现在更喜欢您组织的默认环境或具有实时运行程序的环境，并将其命名"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "改进", "内容": "[Code Review] Changed unlinking a GitHub organization to also turn off its All repositories setting in Code Review; it stays off after you relink until you turn it back on", "中文内容": "[代码审查] 更改了取消链接 GitHub 组织以同时关闭代码审查中的所有存储库设置；重新链接后它会保持关闭状态，直到您重新打开它为止"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[Claude Tag] Fixed Claude Tag setup blocking launch when the channel list couldn't fully load; admins can now launch without picking a channel", "中文内容": "[Claude Tag] 修复了当频道列表无法完全加载时 Claude Tag 设置阻止启动的问题；管理员现在无需选择频道即可启动"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "新增", "内容": "[Claude Tag] Added a Claude Tag row to the Models admin page for Enterprise orgs with Claude Tag connected, linking to where its model defaults are managed", "中文内容": "[Claude Tag] 在已连接 Claude Tag 的企业组织的模型管理页面中添加了 Claude Tag 行，链接到管理其模型默认值的位置"}, {"日期": "2026-11-06", "版本": "2.1.319", "类型": "修复", "内容": "[Claude Tag] Fixed saving auto mode allow rules in Claude Tag admin settings overwriting another admin's changes; the save is now refused with a message", "中文内容": "[Claude Tag] 修复了保存自动模式允许 Claude Tag 管理员设置中的规则覆盖其他管理员的更改；现在保存被拒绝并显示一条消息"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Added a record of your answer when Claude Code asks to turn on the mods it writes in a session", "中文内容": "添加了当 Claude Code 要求打开它在会话中写入的 mod 时的回答记录"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Added `assume_role` on `mantle` upstreams of the Claude apps gateway, for a role in another AWS account and for per-developer AWS cost attribution", "中文内容": "在 Claude 应用程序网关上游的`mantle`上添加了`assume_role`，用于另一个 AWS 账户中的角色以及每个开发人员的 AWS 成本归因"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Added an `effort` option to a mod's `$.model.fork`, so a quick side job can run at `low` whatever effort the session uses; the result reports the effort sent", "中文内容": "在 mod 的`$.model.fork`中添加了`effort`选项，因此无论会话使用什么努力，快速的副业都可以以`low`运行；结果报告了发送的工作量"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Added the date a stored claude.ai sign-in ends to `claude auth status` (`loginExpiresAt`) and to `claude -p` JSON results (`credential_expires_at`)", "中文内容": "将存储的 claude.ai 登录结束日期添加到`claude auth status`（`loginExpiresAt`）和`claude -p` JSON 结果（`credential_expires_at`）"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Added a one-line stderr warning to `claude -p` text output, starting 10 days before a stored claude.ai sign-in ends", "中文内容": "在`claude -p`文本输出中添加了一行 stderr 警告，从存储的 claude.ai 登录结束前 10 天开始"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `--continue` sometimes losing the earlier conversation after a malformed tool call's retries ran out (regression in 2.1.314)", "中文内容": "修复了`--continue`有时会在格式错误的工具调用重试结束后丢失先前的对话（2.1.314 中的回归）"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed macOS sessions with many running Bash commands stalling while memory grew", "中文内容": "修复了 macOS 会话中许多正在运行的 Bash 命令在内存增长时停止的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed permission prompts being answered by keys typed just after sending a message, or before a slow prompt appeared", "中文内容": "修复了在发送消息后或出现缓慢提示之前键入按键来回答权限提示的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `/logout`, `claude auth logout` and `claude mcp remove` reporting success, and changes to trust, consent or MCP settings being dropped with no word, when the config file could not be updated on a shared network home directory", "中文内容": "修复了`/logout`、`claude auth logout`和`claude mcp remove`报告成功的问题，以及当无法在共享网络主目录上更新配置文件时，对信任、同意或 MCP 设置的更改被直接删除的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed jobs exiting with `Not logged in` when another terminal or host signs in again to the same account and organization on the same home", "中文内容": "修复了当另一个终端或主机再次登录同一家庭的同一帐户和组织时作业以“未登录”退出的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `claude mcp add` and `remove` writing the config without its lock: they now wait for it or exit 1, though another job's save can still replace a saved server", "中文内容": "修复了`claude mcp add`和`remove`在没有锁的情况下写入配置的问题：它们现在等待它或退出 1，尽管另一个作业的保存仍然可以替换已保存的服务器"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `claude plugin` commands exiting before a slow token refresh was saved, which could sign you out on the next run", "中文内容": "修复了`claude plugin`命令在保存缓慢令牌刷新之前退出的问题，这可能会让您在下次运行时退出"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `claude plugin validate` passing a custom-named marketplace file that `claude plugin marketplace add` rejects", "中文内容": "修复了“claude 插件验证”传递“claude 插件市场添加”拒绝的自定义命名市场文件的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed stdio MCP servers that exit on the version probe being re-probed on every start; a server that dies in under 3s for its own reason is also pinned to the legacy handshake for 7 days", "中文内容": "修复了在每次启动时重新探测版本探测时退出的 stdio MCP 服务器；因自身原因在 3 秒内死亡的服务器也会被固定到旧版握手中 7 天"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed sessions being refused at startup by an `allowedProviders` list that another login on the same machine had stored", "中文内容": "修复了启动时会话被同一台计算机上的另一个登录存储的`allowedProviders`列表拒绝的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed idle compaction replacing a conversation with a reply that was not a summary", "中文内容": "修复了空闲压缩用非摘要的回复替换对话的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the \"Now using usage credits\" notice reappearing about every 30 seconds while a background subagent is running", "中文内容": "修复了后台子代理运行时大约每 30 秒重新出现一次的“现在使用使用积分”通知"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed custom slash commands that fail, or that only Claude can invoke, printing nothing in `claude -p` and SDK sessions", "中文内容": "修复了失败的自定义斜杠命令，或者只有 Claude 可以调用、在`claude -p`和 SDK 会话中不打印任何内容的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `claude -p` and Agent SDK sessions reporting success when an API error cut off a reply while a mod hooked `turn.step`", "中文内容": "修复了当 API 错误在 mod 挂接`turn.step`时切断回复时`claude -p`和 Agent SDK 会话报告成功的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a message sent right after a model change still running after Stop in headless sessions: Stop now cancels or stops it as it would a queued message", "中文内容": "修复了在无头会话中停止后模型更改后立即发送的消息仍在运行的问题：立即停止会取消或停止它，就像排队消息一样"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a deleted session transcript being re-created with its last prompt when an idle non-interactive session exited", "中文内容": "修复了当空闲的非交互式会话退出时，使用最后一次提示重新创建已删除的会话记录"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `claude remote-control` hosts, the background daemon and self-hosted runners failing to start new sessions (`spawn ENOENT`) after an update or version cleanup removed the binary of a still-running process", "中文内容": "修复了在更新或版本清理删除仍在运行的进程的二进制文件后，“claude Remote-control”主机、后台守护进程和自托管运行程序无法启动新会话（`spawn ENOENT`）的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a running Claude Code process owned by another user (for example one left by `sudo claude`) being treated as dead by version cleanup, which could delete its binary", "中文内容": "修复了另一用户拥有的正在运行的 Claude Code 进程（例如`sudo claude`留下的进程）被版本清理视为死亡，这可能会删除其二进制文件"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `/remote-control` showing a session as available after a failed connection", "中文内容": "修复了`/remote-control`在连接失败后显示会话可用的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `/design revoke` reporting success when the request failed with a 404", "中文内容": "修复了请求失败并出现 404 错误时`/design revoke`报告成功的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a shell command approved after a self-hosted runner or cloud session restart running in the session's start folder, not the folder it was asked in; if that folder can't be entered, it is not run", "中文内容": "修复了自托管运行器或云会话重新启动后批准的 shell 命令在会话的开始文件夹中运行，而不是在要求的文件夹中运行；如果无法进入该文件夹，则不会运行"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed Claude not being told when an approved connector tool was unavailable after a cloud session restart", "中文内容": "修复了云会话重启后批准的连接器工具不可用时克劳德没有被告知的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed cloud sessions being stopped in the middle of a turn when the service refuses uploads for several minutes", "中文内容": "修复了当服务拒绝上传几分钟时云会话在轮流中停止的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed variables a `Setup` hook writes to `CLAUDE_ENV_FILE` not reaching the Bash tool in some cloud sessions", "中文内容": "修复了`Setup`挂钩写入`CLAUDE_ENV_FILE`的变量在某些云会话中未到达 Bash 工具的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the iPhone app showing a cloud session's turn as finished while it kept running, after a response was cut off at a tool call or a refused image or document was removed", "中文内容": "修复了 iPhone 应用程序在工具调用响应被切断或拒绝的图像或文档被删除后，在云会话继续运行时显示云会话已完成的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a restarted session re-sending a message that failed with an API error, ahead of the newer message waiting behind it", "中文内容": "修复了重新启动的会话在等待其后的新消息之前重新发送因 API 错误而失败的消息的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a restarted session dropping its interrupted turn when the restart came right after Claude read a large image or retried a tool call", "中文内容": "修复了当克劳德读取大图像或重试工具调用后立即重新启动时，重新启动的会话会丢失其中断的回合"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed every connection failing when the `NODE_EXTRA_CA_CERTS` file is empty, not PEM, or starts with a damaged certificate: readable certificates are now used, with a warning on stderr", "中文内容": "修复了当`NODE_EXTRA_CA_CERTS`文件为空而不是 PEM 或以损坏的证书开头时每个连接失败的问题：现在使用可读证书，并在 stderr 上发出警告"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed workflows re-running finished agents when resumed after a usage limit", "中文内容": "修复了工作流程在使用限制后恢复时重新运行已完成的代理的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed `/mcp` in cloud sessions counting tools the model can't use; a server's row now shows how many of its tools are available", "中文内容": "修复了模型无法使用的云会话计数工具中的`/mcp`；服务器的行现在显示有多少工具可用"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a duplicate notification when Claude left the status field out of a PushNotification call", "中文内容": "修复了当 Claude 将状态字段排除在 PushNotification 调用之外时出现的重复通知"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the error for a too-large image in a request with more than 20 images always saying the limit was 2000px; it now shows the API's limit", "中文内容": "修复了请求20张以上图片过大总是提示限制为2000px的错误；现在显示 API 的限制"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the runtime in background shell details not updating while the dialog is open", "中文内容": "修复了对话框打开时后台 shell 详细信息中的运行时不更新的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed a mod's `turn.step` hook making a stopped reply finish as a success in headless runs", "中文内容": "修复了 mod 的`turn.step`挂钩，使停止回复完成为无头运行中的成功"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed retention cleanup leaving a home that only runs `claude -p` with no `~/.claude.json` backup: it now takes a fresh backup before deleting the last good one", "中文内容": "修复了保留清理留下仅运行`claude -p`而没有`~/.claude.json`备份的主目录的问题：现在在删除最后一个好的备份之前需要进行新的备份"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the stored login being replaced by an empty file when a network home directory has no room left for data but still takes new files", "中文内容": "修复了当网络主目录没有空间容纳数据但仍需要新文件时，存储的登录名被空文件替换的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed tokens from `setup-token` being refused at start on machines with `forceLoginOrgUUID`, when the token belongs to a permitted organization", "中文内容": "修复了当令牌属于允许的组织时，在具有`forceLoginOrgUUID`的计算机上启动时拒绝来自`setup-token`的令牌"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed non-interactive launches replacing a `~/.claude.json` that isn't valid JSON with defaults; the start now fails, says how to restore the file, and leaves it as is (anthropics/claude-code#87551)", "中文内容": "修复了非交互式启动，用默认值替换了无效 JSON 的 `~/.claude.json`；现在启动失败，说明如何恢复文件，并保持原样（anthropics/claude-code#87551）"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed an empty `~/.claude.json` with no backup being reported as corrupted; Claude Code now starts as it does when the file is missing", "中文内容": "修复了空的`~/.claude.json`，没有备份被报告为已损坏；克劳德代码现在像文件丢失时一样启动"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the restore command printed for a damaged or missing `~/.claude.json` naming an empty or cut-off backup, or failing on a read-only file", "中文内容": "修复了为损坏或丢失的`~/.claude.json`命名空备份或切断备份或在只读文件上失败而打印的恢复命令"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Fixed the sign-in failure when a stored claude.ai login reaches its time limit: it now says so, and in `claude -p` names `claude auth login` and `claude setup-token`", "中文内容": "修复了当存储的 claude.ai 登录达到时间限制时登录失败的问题：现在是这样说的，并且在`claude -p`中命名为`claude auth login`和`claude setup-token`"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved how `~/.claude.json`, settings files and the stored login survive saves on shared network home directories: they are less often deleted, briefly emptied or replaced by a near-empty or older copy", "中文内容": "改进了`~/.claude.json`、设置文件和存储的登录信息在共享网络主目录中保存的方式：它们很少被删除、短暂清空或被近乎空或较旧的副本替换"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved sessions on network file systems to look again when the configuration file is wrongly reported as missing, so fewer start without your MCP servers and trusted folders", "中文内容": "改进了网络文件系统上的会话，以便在配置文件被错误报告为丢失时再次查看，从而减少在没有 MCP 服务器和受信任文件夹的情况下启动的情况"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved MCP tool errors: a call made before the tool is loaded now returns its input schema", "中文内容": "改进了 MCP 工具错误：加载工具之前进行的调用现在返回其输入架构"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved the reliability of git commits and pull request creation when the Bash tool runs macOS's built-in `/bin/bash`", "中文内容": "当 Bash 工具运行 macOS 内置的 `/bin/bash` 时，提高了 git 提交和拉取请求创建的可靠性"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved \"Ask your admin for more usage\" in the usage limit menu to send the request in one step", "中文内容": "改进了使用限制菜单中的“询问管理员更多使用情况”，可一步发送请求"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved how fast remote sessions reconnect after a pause or sleep", "中文内容": "改进了远程会话在暂停或睡眠后重新连接的速度"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved You should know toasts to say \"try again\" instead of \"press 2\", which only works in the terminal", "中文内容": "改进你应该知道吐司说“再试一次”而不是“按 2”，这仅在终端中有效"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved auto-update reliability: a brief network failure while verifying a release is now retried right away instead of waiting for the next check", "中文内容": "改进的自动更新可靠性：验证版本时出现短暂的网络故障现在会立即重试，而不是等待下一次检查"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Improved unattended runs (`claude -p`, SDK apps) to stop rewriting `~/.claude.json` on every run when nothing in it changed", "中文内容": "改进了无人值守运行（`claude -p`、SDK 应用程序），以在每次运行时停止重写`~/.claude.json`（当其中没有任何更改时）"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed Claude Code to no longer install or update the IDE extension when started in an IDE terminal; use `/ide` from an outside terminal or your editor's extensions view", "中文内容": "更改了 Claude Code，使其在 IDE 终端中启动时不再安装或更新 IDE 扩展；从外部终端或编辑器的扩展视图使用`/ide`"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed subagents to stop instead of switching models when \"Switch models when a message is flagged\" is set to \"Ask each time\"", "中文内容": "当“标记消息时切换模型”设置为“每次询问”时，将子代理更改为停止而不是切换模型"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed background subagents to move a shell command to the background after 3 minutes on all providers, so the prompt cache doesn't expire while it runs", "中文内容": "更改了后台子代理，以便在所有提供程序上 3 分钟后将 shell 命令移至后台，因此提示缓存在运行时不会过期"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed subagent progress summaries on Bedrock, Vertex, Foundry, or with telemetry off: on a cold prompt cache, one can now wait up to 5 minutes for the subagent's pending response", "中文内容": "更改了 Bedrock、Vertex、Foundry 或遥测关闭时的子代理进度摘要：在冷提示缓存上，现在最多可以等待 5 分钟以获得子代理的待处理响应"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed what a mod attaches at `prompt.submit` to stay in the user's turn rather than go out as a system message", "中文内容": "更改了 mod 在`prompt.submit`处附加的内容，以留在用户的回合中，而不是作为系统消息出去"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed `deniedMcpServers` URL entries to also block Anthropic-provided servers whose upstream URL matches, and connectors in cloud sessions and on self-hosted runners, where the session is given the connector's own URL; otherwise deny a connector by name", "中文内容": "更改了`deniedMcpServers` URL 条目，以阻止 Anthropic 提供的上游 URL 匹配的服务器，以及云会话和自托管运行器中的连接器，其中会话被赋予连接器自己的 URL；否则按名称拒绝连接器"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed the `/permissions` rule details, built-in rules and delete confirmation views to use the standard dialog; pressing Ctrl+C twice there now goes back or cancels instead of quitting", "中文内容": "更改了`/permissions`规则详细信息、内置规则和删除确认视图以使用标准对话框；按 Ctrl+C 两次现在会返回或取消而不是退出"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Changed `/claude-api managed-agents-onboard` to give a new agent's built-in tools, and a quickstart template's MCP tools, the `auto` permission policy (\"Judge risky actions\") by default, matching the Claude Console; say \"run without asking\" to opt out", "中文内容": "更改了 `/claude-api Managed-agents-onboard` 以提供新代理的内置工具和快速入门模板的 MCP 工具，默认情况下提供 `auto` 权限策略（“判断危险操作”），与 Claude Console 相匹配；说“不问就跑”以选择退出"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "移除", "内容": "Removed the 2.1.288 fix that kept the model's earlier thinking when resuming a conversation started on 2.1.286 or earlier; that thinking can now be dropped", "中文内容": "删除了 2.1.288 修复，该修复在恢复 2.1.286 或更早版本开始的对话时保留模型的早期思维；现在可以放弃这种想法"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Gateway: Added a log warning when the Google access token from a federation (`external_account`) credentials file is about to expire", "中文内容": "网关：当来自联合 (`external_account`) 凭证文件的 Google 访问令牌即将过期时添加了日志警告"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Gateway: Improved the log hints about `listen.trusted_proxies`: they now say to list only a proxy that adds the connecting address to `X-Forwarded-For` itself", "中文内容": "网关：改进了有关`listen.trusted_proxies`的日志提示：他们现在说仅列出将连接地址添加到`X-Forwarded-For`本身的代理"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Gateway: Improved the warning when AWS CountTokens fails on Amazon Bedrock: it says Claude Code, not the gateway, counts after the 501, and points at IAM only when AWS denies access", "中文内容": "网关：改进了 AWS CountTokens 在 Amazon Bedrock 上失败时的警告：它显示 Claude Code（而不是网关）在 501 之后进行计数，并且仅在 AWS 拒绝访问时才指向 IAM"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Self-hosted runner: Added `CLAUDE_RUNNER_SPAWN_REASON` to the orchestrator's spawn-runner hook environment: why Anthropic sent the request (e.g. `runner_lost`, `resumed`); unset when none was sent", "中文内容": "自托管运行器：将`CLAUDE_RUNNER_SPAWN_REASON`添加到协调器的spawn-runner钩子环境中：为什么Anthropic发送请求（例如`runner_lost`、`resumed`）；当没有发送时取消设置"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "Self-hosted runner: Added a startup warning when `--release-idle-session-min` is the last argument with no value (still ignored) or has a value of only spaces (still read as `0`)", "中文内容": "自托管运行器：当`--release-idle-session-min`是最后一个没有值的参数（仍然被忽略）或只有空格的值（仍然读为`0`）时，添加了启动警告"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Self-hosted runner: Changed the orchestrator's log lines: `ok session=…` now prints at every log level on stdout (was debug only, stderr) with `reason=…` after `jti=…`, and `nack session=…` ends its fields with `reason=…` after `retryable=…`; update scripts that match `retryable=true:` or `retryable=false:`", "中文内容": "自托管运行器：更改了协调器的日志行：`ok session=…`现在在标准输出（仅调试，stderr）上的每个日志级别上打印`jti=…`之后的`reason=…`，以及`nack session=…`在`retryable=…`之后以`reason=…`结束其字段；更新匹配 `retryable=true:` 或 `retryable=false:` 的脚本"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "Remote Control: Fixed a misleading \"spawn error: ENOENT\" when a session's working folder is missing; the error now names the folder", "中文内容": "远程控制：修复了会话工作文件夹丢失时出现的误导性“生成错误：ENOENT”；错误现在命名文件夹"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "Remote Control: Improved the title a fork of a terminal fork is created with when the app doesn't set one: \"Name (fork 2)\"", "中文内容": "远程控制：改进了当应用程序未设置时创建终端分叉的标题：“名称（分叉 2）”"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "[VSCode] Fixed a window whose sign-in the organization's settings refuse starting a new Claude Code process in the background every minute", "中文内容": "[VSCode] 修复了登录组织设置拒绝每分钟在后台启动新的 Claude Code 进程的窗口"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "[VSCode] Fixed a long word in the chat panel's error banner pushing its close button out of view", "中文内容": "[VSCode] 修复了聊天面板错误横幅中的一个长单词将其关闭按钮推出视图的问题"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "[VSCode] Improved the sign-in screen to show what Claude Code printed when its sign-in status check fails", "中文内容": "[VSCode] 改进了登录屏幕，以显示 Claude Code 在登录状态检查失败时打印的内容"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "[Cloud sessions] Added a No repository option: a cloud session on an Anthropic-hosted environment can now start without picking a repository", "中文内容": "[云会话] 添加了“无存储库”选项：Anthropic 托管环境上的云会话现在无需选择存储库即可启动"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "[Cloud sessions] Added the usual Chrome names to cloud sessions, so tools other than Playwright can find the built-in Chromium through google-chrome and CHROME_PATH", "中文内容": "[云会话] 在云会话中添加了常用的 Chrome 名称，因此 Playwright 以外的工具可以通过 google-chrome 和 CHROME_PATH 找到内置的 Chromium"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "新增", "内容": "[Cloud sessions] Added a New session button to the card shown when a cloud session's environment was deleted, where the message box is hidden", "中文内容": "[云会话] 在删除云会话环境时显示的卡片上添加了“新建会话”按钮，其中隐藏了消息框"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "[Cloud sessions] Fixed reading GitHub Actions logs in cloud sessions: `gh run view --log` and `gh api` log requests now get the log in most environments, not an unreachable redirect", "中文内容": "[云会话] 修复了在云会话中读取 GitHub Actions 日志的问题：`gh run view --log`和`gh api`日志请求现在在大多数环境中获取日志，而不是无法访问的重定向"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "[Cloud sessions] Improved most Create PR failure messages in cloud and Remote Control sessions: they now give the reason or a link to GitHub instead of saying Try again", "中文内容": "[云会话] 改进了大多数在云和远程控制会话中创建 PR 失败消息：它们现在给出原因或 GitHub 链接，而不是说重试"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "[Cloud sessions] Changed connector search results to tell Claude that the search covers only part of the connector directory", "中文内容": "[云会话] 更改了连接器搜索结果，以告诉 Claude 搜索仅覆盖连接器目录的一部分"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "[Remote Control] Fixed side-by-side checkouts of one repository looking identical in the environment menu's Remote Control rows; each now shows its own folder name", "中文内容": "[远程控制] 修复了一个存储库的并排签出在环境菜单的远程控制行中看起来相同的问题；每个现在都显示自己的文件夹名称"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "修复", "内容": "[Claude Tag] Fixed keyboard focus and screen reader announcements in Claude Tag admin setup; pressing Escape in the connect form no longer also closes the Add dialog", "中文内容": "[Claude Tag] 修复了 Claude Tag 管理设置中的键盘焦点和屏幕阅读器公告；在连接表单中按 Escape 键不再关闭“添加”对话框"}, {"日期": "2026-11-03", "版本": "2.1.318", "类型": "改进", "内容": "[Code Review] Improved the Code Review analytics page to retry once after a server or network failure, then show a Try again banner instead of empty cards", "中文内容": "[代码审查] 改进了代码审查分析页面，以便在服务器或网络故障后重试一次，然后显示重试横幅而不是空卡"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added a warning to `/schedule` when a new cloud scheduled task gets connectors you did not ask for, with how to remove them", "中文内容": "当新的云计划任务获取您未请求的连接器时，向`/schedule`添加了警告，以及如何删除它们"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added a check that asks before a web or shell tool call sends your account email address to the network", "中文内容": "添加了一项检查，在 Web 或 shell 工具调用将您的帐户电子邮件地址发送到网络之前进行询问"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added `onFailure: \"block\"` for Agent SDK hook callbacks, so a callback that fails blocks the action instead of letting it run", "中文内容": "为 Agent SDK 挂钩回调添加了 `onFailure: \"block\"`，因此失败的回调会阻止操作而不是让它运行"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added a notice in Claude Desktop's Code tab when your organization's remote managed settings haven't loaded for the session, and another once they do", "中文内容": "当您的组织的远程托管设置尚未为会话加载时，在 Claude Desktop 的“代码”选项卡中添加了一条通知，一旦加载则添加了另一个通知"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added a notice when auto mode's check has no answer for a subagent's tool call, which used to leave nothing in the main view", "中文内容": "添加了当自动模式的检查对子代理的工具调用没有答案时的通知，该工具调用过去不会在主视图中留下任何内容"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added `anthropic.plan`, `anthropic.seat_type`, `anthropic.provider` and `anthropic.custom_base_url` to OTel metrics, events and spans", "中文内容": "向 OTel 指标、事件和跨度添加了`anthropic.plan`、`anthropic.seat_type`、`anthropic.provider`和`anthropic.custom_base_url`"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added a cost report to the Claude apps gateway admin API, `GET /v1/organizations/analytics/cost`, for reading past spend over a date range in total, per developer, per day or per IdP group", "中文内容": "向 Claude 应用网关管理 API 添加了成本报告`GET /v1/organizations/analytics/cost`，用于读取某个日期范围内每个开发人员、每天或每个 IdP 组的过去总支出"}, {"日期": "2026-11-02", "版本": "2.1.317", "类型": "新增", "内容": "Added a daily record of each developer's IdP groups on Claude apps
